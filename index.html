<script>
// ============================================
// CONFIGURATION - แก้ไข URL ให้ตรงกับ Web App ของคุณ
// ============================================
const API_URL = "https://script.google.com/macros/s/YOUR_WEB_APP_URL/exec";
const LIFF_ID = "2006974084-pCKlrYsc";

let products = [], cart = [], categories = [], adminCategories = [], allUsers = [], allOrders = [], orderHistory = [];
let currentCategory = "all", searchQuery = "", currentTab = "all", isRadialOpen = false;
let liffProfile = null, userProfile = null, isAdmin = false;
let currentEditingOrder = null, currentEditingUser = null;
let storeSettings = { STORE_NAME: "E-Shop Thailand", PROMPTPAY_PHONE: "" };
let qrTimerInterval = null;

function showLoading() { document.getElementById("loadingOverlay").classList.remove("hidden"); }
function hideLoading() { document.getElementById("loadingOverlay").classList.add("hidden"); }
function formatPrice(p) { return p.toLocaleString("th-TH") + " บาท"; }
function showToast(title, icon = "success") { Swal.fire({ title, icon, toast: true, position: "top-end", showConfirmButton: false, timer: 2000 }); }
function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch])); }
function isModalVisible() { return Array.from(document.querySelectorAll(".modal-container")).some(modal => !modal.classList.contains("hidden")); }
function updateDockVisibility() { const dock = document.getElementById("dockNav"); if(dock) dock.classList.toggle("is-hidden", isModalVisible()); }

async function fetchAPI(action, params = {}) {
    const url = new URL(API_URL);
    url.searchParams.append("action", action);
    Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
    const res = await fetch(url.toString());
    return res.json();
}
async function fetchPostAPI(action, formData) {
    formData.append("action", action);
    const res = await fetch(API_URL, { method: "POST", body: formData });
    return res.json();
}

// ========== Products ==========
async function loadProducts() {
    showLoading();
    try {
        const res = await fetchAPI("getProducts");
        if(res.success && res.products) { products = res.products; renderProducts(); setupCategories(); updateCommandSuggestions(); if(isAdmin) loadAdminProducts(); }
    } catch(e) { console.error(e); }
    hideLoading();
}
function renderProducts() {
    let filtered = products.filter(p => currentCategory === "all" || p.category === currentCategory);
    if(searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
    const grid = document.getElementById("productGrid");
    if(!filtered.length) { grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">ไม่พบสินค้า</div>`; return; }
    grid.innerHTML = filtered.map(p => { const stock = Number(p.stock)||0, soldOut = stock<=0; return `<div class="product-card ${soldOut?'opacity-70':''}" data-product='${JSON.stringify(p)}'><div class="relative"><img src="${p.image}" class="w-full h-32 object-cover" onerror="this.src='https://picsum.photos/id/20/200/200'">${soldOut?'<div class="absolute inset-0 bg-black/45 flex items-center justify-center text-white font-semibold">หมด</div>':''}</div><div class="p-2"><div class="text-xs text-gray-400"><i class="fas fa-tag mr-1"></i>${p.category}</div><div class="font-medium text-sm">${p.name}</div><div class="text-rose-500 font-bold">${formatPrice(p.price)}</div><div class="text-xs ${soldOut?'text-red-500':'text-gray-500'}">คงเหลือ ${stock} ชิ้น</div><button class="add-to-cart-btn w-full mt-2 ${soldOut?'bg-gray-300 text-gray-500 cursor-not-allowed':'bg-rose-500 text-white'} py-1.5 rounded-lg text-sm" data-product='${JSON.stringify(p)}' ${soldOut?'disabled':''}><i class="fas fa-cart-plus mr-1"></i> ${soldOut?'สินค้าหมด':'หยิบใส่ตะกร้า'}</button></div></div>`; }).join("");
    document.querySelectorAll(".add-to-cart-btn").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); addToCart(JSON.parse(btn.dataset.product)); }));
    document.querySelectorAll(".product-card").forEach(card => card.addEventListener("contextmenu", (e) => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, JSON.parse(card.dataset.product)); }));
}
function setupCategories() {
    const cats = ["all", ...new Set(products.map(p=>p.category))];
    const container = document.getElementById("categoryFilter");
    container.innerHTML = cats.map(cat => `<button data-cat="${cat}" class="cat-btn ${cat==="all"?"active":""}">${cat==="all"?"ทั้งหมด":cat}</button>`).join("");
    document.querySelectorAll(".cat-btn").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); currentCategory = btn.dataset.cat; renderProducts(); }));
}
function updateCommandSuggestions() {
    const searchInput = document.getElementById("searchInput"), suggestionsDiv = document.getElementById("suggestions");
    searchInput.addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        if(q.length<1){ suggestionsDiv.classList.add("hidden"); return; }
        const matches = products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5);
        if(matches.length){ suggestionsDiv.innerHTML = matches.map(p=>`<div class="suggestion-item" data-name="${p.name}"><i class="fas fa-box"></i><div><div>${p.name}</div><div class="text-xs text-gray-400">${p.category} - ${formatPrice(p.price)}</div></div></div>`).join(""); suggestionsDiv.classList.remove("hidden");
        document.querySelectorAll(".suggestion-item").forEach(item=>item.addEventListener("click",()=>{ searchInput.value=item.dataset.name; searchQuery=item.dataset.name; suggestionsDiv.classList.add("hidden"); renderProducts(); })); }
        else suggestionsDiv.classList.add("hidden");
    });
    document.addEventListener("click", (e)=>{ if(!suggestionsDiv.contains(e.target) && e.target!==searchInput) suggestionsDiv.classList.add("hidden"); });
}
function renderTabBar() {
    const tabBar = document.getElementById("tabBar"), tabs = [{ id:"all", icon:"th-large", name:"ทั้งหมด" },{ id:"clothing", icon:"tshirt", name:"เสื้อผ้า" },{ id:"shoes", icon:"shoe-prints", name:"รองเท้า" },{ id:"accessories", icon:"gem", name:"เครื่องประดับ" },{ id:"bags", icon:"bag-shopping", name:"กระเป๋า" }];
    tabBar.innerHTML = tabs.map(t=>`<div class="tab-item ${currentTab===t.id?"active":""}" data-tab="${t.id}"><i class="fas fa-${t.icon}"></i><span>${t.name}</span></div>`).join("");
    document.querySelectorAll(".tab-item").forEach(tab=>tab.addEventListener("click",()=>{ currentTab=tab.dataset.tab; document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active")); tab.classList.add("active"); renderProducts(); }));
}

// ========== Cart ==========
function addToCart(p) {
    const stock = Number(p.stock)||0;
    if(stock<=0){ showToast("สินค้าหมด","error"); return; }
    let exist = cart.find(i=>i.id===p.id);
    if(exist){ if(exist.quantity>=stock){ showToast(`สินค้าเหลือ ${stock} ชิ้น`,"error"); return; } exist.quantity++; }
    else cart.push({...p, quantity:1, stock});
    updateCartUI(); showToast(p.name+" ใส่ตะกร้าแล้ว");
}
function removeFromCart(id){ cart=cart.filter(i=>i.id!==id); updateCartUI(); }
function updateQuantity(id,d){ let i=cart.find(i=>i.id===id); if(i){ if(d>0 && i.quantity>=(Number(i.stock)||0)){ showToast(`สินค้าเหลือ ${i.stock} ชิ้น`,"error"); return; } i.quantity+=d; if(i.quantity<=0) removeFromCart(id); else updateCartUI(); } }
function updateCartUI() {
    document.getElementById("cartCount").innerText = cart.reduce((s,i)=>s+i.quantity,0);
    document.getElementById("cartTotal").innerHTML = formatPrice(cart.reduce((s,i)=>s+(i.price*i.quantity),0));
    const container = document.getElementById("cartItems");
    if(!cart.length){ container.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fas fa-shopping-cart text-4xl mb-3"></i><p>ตะกร้าว่างเปล่า</p></div>`; return; }
    container.innerHTML = cart.map(i=>`<div class="cart-item flex gap-3 bg-gray-50 rounded-xl p-3"><img src="${i.image}" class="w-16 h-16 rounded object-cover"><div class="flex-1"><div class="font-medium text-sm">${i.name}</div><div class="text-rose-500 text-sm">${formatPrice(i.price)}</div><div class="flex gap-2 mt-2"><button class="quantity-btn" onclick="updateQuantity('${i.id}', -1)"><i class="fas fa-minus"></i></button><span class="w-8 text-center">${i.quantity}</span><button class="quantity-btn" onclick="updateQuantity('${i.id}', 1)"><i class="fas fa-plus"></i></button><button onclick="removeFromCart('${i.id}')" class="ml-auto text-red-400"><i class="fas fa-trash-alt"></i></button></div></div></div>`).join("");
}
function showContextMenu(x,y,p) {
    removeContextMenu(); const menu = document.createElement("div"); menu.className="context-menu"; menu.style.left=x+"px"; menu.style.top=y+"px";
    menu.innerHTML = `<div class="context-menu-item" data-action="add"><i class="fas fa-cart-plus"></i> หยิบใส่ตะกร้า</div><div class="context-menu-item" data-action="detail"><i class="fas fa-info-circle"></i> รายละเอียด</div><div class="context-menu-item danger" data-action="share"><i class="fas fa-share-alt"></i> แชร์</div>`;
    document.body.appendChild(menu);
    menu.querySelectorAll(".context-menu-item").forEach(item=>item.addEventListener("click",()=>{ if(item.dataset.action==="add") addToCart(p); else if(item.dataset.action==="detail") Swal.fire({ title:p.name, html:`<img src="${p.image}" class="w-full rounded-lg mb-3"><p>ราคา: ${formatPrice(p.price)}</p><p>หมวดหมู่: ${p.category}</p>` }); else if(item.dataset.action==="share"){ navigator.clipboard.writeText(p.name+" - "+formatPrice(p.price)); showToast("คัดลอกข้อมูลสินค้าแล้ว"); } removeContextMenu(); }));
}
function removeContextMenu(){ const menu=document.querySelector(".context-menu"); if(menu) menu.remove(); }

// ========== PromptPay ==========
function crc16ccitt(data){ let crc=0xFFFF; for(let i=0;i<data.length;i++){ crc^=data.charCodeAt(i)<<8; for(let j=0;j<8;j++){ if(crc&0x8000) crc=(crc<<1)^0x1021; else crc<<=1; } } return crc&0xFFFF; }
function generatePromptPayPayload(amount, phoneNumber){
    const phone=phoneNumber.replace(/\D/g,'');
    if(!phone||phone.length!==10) return null;
    let payload="00020101021129370016A000000677010111";
    const phoneLen=phone.length;
    const phoneHex=(phoneLen+13).toString(16).padStart(2,'0').toUpperCase();
    payload+=phoneHex;
    payload+="01130066"+phone;
    const amountStr=amount.toFixed(2);
    const amountLen=amountStr.length;
    const amountHex=(amountLen+5).toString(16).padStart(2,'0').toUpperCase();
    payload+="5303764"+amountHex+amountStr;
    const crc=crc16ccitt(payload);
    payload+="6304"+crc.toString(16).padStart(4,'0').toUpperCase();
    return payload;
}
function showPromptPayQR(amount, orderId){
    const phone=storeSettings.PROMPTPAY_PHONE;
    if(!phone){ Swal.fire("แจ้งเตือน","ยังไม่ได้ตั้งค่าหมายเลข PromptPay กรุณาติดต่อแอดมิน","error"); return false; }
    const payload=generatePromptPayPayload(amount, phone);
    if(!payload){ Swal.fire("แจ้งเตือน","หมายเลข PromptPay ไม่ถูกต้อง","error"); return false; }
    document.getElementById("qrAmount").innerText=formatPrice(amount);
    document.getElementById("qrCodeContainer").innerHTML="";
    try{ new QRCode(document.getElementById("qrCodeContainer"),{ text:payload, width:200, height:200, colorDark:"#000000", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M }); }
    catch(e){ document.getElementById("qrCodeContainer").innerHTML='<div class="text-red-500">ไม่สามารถสร้าง QR Code ได้</div>'; return false; }
    if(qrTimerInterval) clearInterval(qrTimerInterval);
    let secondsLeft=60;
    const timerEl=document.getElementById("qrTimer");
    timerEl.innerText=`⏱️ QR Code จะหมดอายุใน ${secondsLeft} วินาที`;
    qrTimerInterval=setInterval(()=>{ secondsLeft--; if(secondsLeft<=0){ clearInterval(qrTimerInterval); timerEl.innerText="❌ QR Code หมดอายุแล้ว กรุณาสั่งซื้อใหม่"; document.getElementById("qrCodeContainer").innerHTML='<div class="text-red-500">QR Code หมดอายุ</div>'; Swal.fire("QR Code หมดอายุ","กรุณาสั่งซื้อใหม่หรือติดต่อแอดมิน","warning"); } else { timerEl.innerText=`⏱️ QR Code จะหมดอายุใน ${secondsLeft} วินาที`; } },1000);
    document.getElementById("qrModal").classList.remove("hidden");
    return true;
}

// ========== Order & Payment ==========
async function submitOrder() {
    if(!cart.length){ showToast("ไม่มีสินค้าในตะกร้า","error"); return; }
    for(const item of cart){ const latestProduct=products.find(p=>p.id===item.id); const stock=Number(latestProduct?.stock??item.stock)||0; if(stock<=0||item.quantity>stock){ showToast(`สินค้า "${item.name}" เหลือ ${stock} ชิ้น`,"error"); return; } }
    const name=document.getElementById("custName").value.trim(), email=document.getElementById("custEmail").value.trim(), phone=document.getElementById("custPhone").value.trim(), address=document.getElementById("custAddress").value.trim(), paymentMethod=document.getElementById("paymentMethod").value;
    if(!name||!email||!phone||!address){ showToast("กรุณากรอกข้อมูลให้ครบ","error"); return; }
    if(userProfile){ userProfile.displayName=name; userProfile.email=email; userProfile.phone=phone; userProfile.address=address; await updateUserProfile({ userId:userProfile.userId, displayName:name, email:email, phone:phone, address:address, pictureUrl:userProfile.pictureUrl }); }
    const items=cart.map(i=>({ id:i.id, name:i.name, price:i.price, quantity:i.quantity })), total=cart.reduce((s,i)=>s+(i.price*i.quantity),0);
    const fd=new FormData();
    fd.append("name",name); fd.append("email",email); fd.append("phone",phone); fd.append("address",address); fd.append("lineId",userProfile?.userId||"web_user"); fd.append("lineName",userProfile?.lineName||""); fd.append("items",JSON.stringify(items)); fd.append("total",total); fd.append("paymentMethod",paymentMethod);
    showLoading();
    try{
        const res=await fetch(API_URL,{ method:"POST", body:fd }); const result=await res.json();
        if(result.success){
            if(paymentMethod==="promptpay"){ showPromptPayQR(total,result.orderId); }
            await sendFlexMessage({ orderId:result.orderId, items, total });
            Swal.fire({ title:"สั่งซื้อสำเร็จ!", html:`เลขที่: <strong>${result.orderId}</strong>`, icon:"success" });
            cart=[]; updateCartUI(); closeCart(); document.getElementById("checkoutModal").classList.add("hidden");
            await loadProducts();
            if(userProfile?.userId){ orderHistory=await fetchAPI("getUserOrders",{ lineId:userProfile.userId }); userProfile=await fetchAPI("getUserProfile",{ lineId:userProfile.userId }); }
        } else { Swal.fire("ผิดพลาด",result.error,"error"); }
    } catch(e){ Swal.fire("ผิดพลาด","เชื่อมต่อไม่ได้","error"); }
    hideLoading();
}
async function sendFlexMessage(orderData){
    if(!liff.isInClient()) return;
    try{ await liff.sendMessages([{ type:"flex", altText:"ใบเสร็จ", contents:{ type:"bubble", header:{ type:"box", layout:"vertical", contents:[{ type:"text", text:"ใบเสร็จการสั่งซื้อ", weight:"bold", color:"#f43f5e" },{ type:"text", text:orderData.orderId, size:"sm", color:"#666666" }] }, body:{ type:"box", layout:"vertical", contents:[{ type:"text", text:"รายละเอียด", weight:"bold" },{ type:"separator" },...orderData.items.map(i=>({ type:"box", layout:"horizontal", contents:[{ type:"text", text:`${i.name} x ${i.quantity}`, flex:2 },{ type:"text", text:formatPrice(i.price*i.quantity), flex:1, align:"end" }] })),{ type:"separator" },{ type:"box", layout:"horizontal", contents:[{ type:"text", text:"รวมทั้งสิ้น", weight:"bold" },{ type:"text", text:formatPrice(orderData.total), weight:"bold", align:"end", color:"#f43f5e" }] }] }, footer:{ type:"box", layout:"vertical", contents:[{ type:"text", text:"ขอบคุณที่ใช้บริการ", align:"center" }] } } }]); }
    catch(e){ console.log(e); }
}

// ========== Slip Upload ==========
async function uploadSlip(orderId, totalAmount, customerName) {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        showLoading();
        try{
            const reader = new FileReader();
            reader.onloadend = async function() {
                const base64 = reader.result.split(',')[1];
                const fd = new FormData();
                fd.append('action', 'uploadSlip');
                fd.append('orderId', orderId);
                fd.append('lineId', userProfile?.userId || '');
                fd.append('fileData', base64);
                fd.append('fileName', file.name);
                const res = await fetch(API_URL, { method:'POST', body: fd });
                const result = await res.json();
                if(result.success){
                    showToast('อัปโหลดสลิปสำเร็จ');
                    const notifyFd = new FormData();
                    notifyFd.append('action', 'sendSlipNotify');
                    notifyFd.append('orderId', orderId);
                    notifyFd.append('slipUrl', result.slipUrl);
                    notifyFd.append('customerName', customerName);
                    notifyFd.append('total', totalAmount);
                    await fetch(API_URL, { method:'POST', body: notifyFd });
                    orderHistory = await fetchAPI('getUserOrders', { lineId: userProfile.userId });
                    if(document.getElementById('orderHistoryModal') && !document.getElementById('orderHistoryModal').classList.contains('hidden')){
                        showAllOrders();
                    }
                } else { Swal.fire('ผิดพลาด', result.error, 'error'); }
                hideLoading();
            };
            reader.readAsDataURL(file);
        } catch(err){ hideLoading(); Swal.fire('ผิดพลาด', err.message, 'error'); }
    };
    fileInput.click();
}

// ========== Admin Functions ==========
async function checkAdminStatus(lineId){
    try{ const res=await fetchAPI("checkAdmin",{ lineId:lineId }); isAdmin=res.isAdmin||false; document.getElementById("radialAdminBtn").classList.toggle("hidden",!isAdmin); renderTabBar(); return isAdmin; }
    catch(e){ return false; }
}
async function loadAllOrders(){
    if(!isAdmin) return;
    try{ const res=await fetchAPI("getAllOrders",{ lineId:userProfile?.userId }); allOrders=res||[]; renderAdminOrders(); }
    catch(e){ console.error(e); }
}
function renderAdminOrders(){
    const container=document.getElementById("adminOrdersList");
    if(!allOrders.length){ container.innerHTML='<div class="text-center text-gray-400 py-10">ไม่มีคำสั่งซื้อ</div>'; return; }
    container.innerHTML=allOrders.map(o=>{ let sc=""; if(o.status==="Pending") sc="status-pending"; else if(o.status==="Paid") sc="status-paid"; else if(o.status==="Processing") sc="status-processing"; else if(o.status==="Shipped") sc="status-shipped"; else if(o.status==="Delivered") sc="status-delivered"; else if(o.status==="Cancelled") sc="status-cancelled";
        const slipHtml = o.slipUrl ? `<div class="mt-1"><a href="${o.slipUrl}" target="_blank" class="text-xs text-blue-500"><i class="fas fa-receipt"></i> ดูสลิป</a></div>` : '';
        const trackingHtml = (o.trackingLink && o.status === "Shipped") ? `<div class="mt-1"><a href="${o.trackingLink}" target="_blank" class="text-xs text-green-600"><i class="fas fa-box"></i> ติดตามพัสดุ</a></div>` : '';
        return `<div class="admin-card"><div class="admin-card-header"><div><div class="font-bold text-sm">${o.orderId}</div><div class="text-xs text-gray-400">${o.timestamp}</div><div class="text-sm mt-1"><i class="fas fa-user mr-1"></i>${o.name}</div><div class="text-xs"><i class="fas fa-phone mr-1"></i>${o.phone}</div>${slipHtml}${trackingHtml}</div><div class="text-right"><div class="font-bold ${sc}">${o.status||"Pending"}</div><div class="text-rose-500 font-bold">${formatPrice(o.total)}</div></div></div><div class="flex gap-2 mt-3"><button onclick="openOrderStatusModal('${o.orderId}', '${o.status}', '${o.lineId}', '${o.name}')" class="flex-1 bg-rose-500 text-white py-1.5 rounded-lg text-sm"><i class="fas fa-edit mr-1"></i>อัพเดทสถานะ</button></div></div>`;
    }).join("");
}
function openOrderStatusModal(orderId,status,customerLineId,customerName){
    currentEditingOrder={ orderId,status,customerLineId,customerName };
    document.getElementById("orderStatusInfo").innerHTML=`<strong>${orderId}</strong><br>ลูกค้า: ${customerName}`;
    document.getElementById("newOrderStatus").value=status;
    const trackingGroup = document.getElementById("trackingLinkGroup");
    const trackingInput = document.getElementById("trackingLink");
    if(status === "Shipped"){
        trackingGroup.classList.remove("hidden");
        const order = allOrders.find(o => o.orderId === orderId);
        if(order && order.trackingLink) trackingInput.value = order.trackingLink;
        else trackingInput.value = "";
    } else {
        trackingGroup.classList.add("hidden");
        trackingInput.value = "";
    }
    document.getElementById("orderStatusModal").classList.remove("hidden");
}
async function updateOrderStatus(){
    const newStatus = document.getElementById("newOrderStatus").value;
    const trackingLink = document.getElementById("trackingLink").value.trim();
    if(!currentEditingOrder) return; showLoading();
    try{
        const fd=new FormData();
        fd.append("orderId",currentEditingOrder.orderId);
        fd.append("status",newStatus);
        fd.append("customerLineId",currentEditingOrder.customerLineId);
        fd.append("adminLineId",userProfile?.userId);
        if(trackingLink) fd.append("trackingLink",trackingLink);
        const res=await fetchPostAPI("updateOrderStatus",fd);
        if(res.success){
            showToast("อัพเดทสถานะสำเร็จ");
            document.getElementById("orderStatusModal").classList.add("hidden");
            await loadAllOrders();
            await loadProducts();
            if(userProfile?.userId){
                orderHistory = await fetchAPI("getUserOrders",{ lineId:userProfile.userId });
            }
        } else { Swal.fire("ผิดพลาด",res.error,"error"); }
    } catch(e){ Swal.fire("ผิดพลาด",e.message,"error"); }
    hideLoading();
}
async function loadAdminProducts(){ const container=document.getElementById("adminProductsList"); if(!products.length){ container.innerHTML='<div class="text-center text-gray-400 py-10">ไม่มีสินค้า</div>'; return; } container.innerHTML=products.map(p=>`<div class="product-list-item"><img src="${p.image}" class="w-16 h-16 object-cover rounded"><div class="flex-1"><div class="font-medium">${p.name}</div><div class="text-sm text-gray-500">${p.category}</div><div class="text-rose-500 font-bold">${formatPrice(p.price)}</div><div class="text-xs ${(Number(p.stock)||0)<=0?'text-red-500':'text-gray-500'}">คงเหลือ ${Number(p.stock)||0} ชิ้น</div></div><div class="flex gap-2"><button onclick="editProduct('${p.id}')" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-sm"><i class="fas fa-edit"></i></button><button onclick="deleteProduct('${p.id}')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm"><i class="fas fa-trash"></i></button></div></div>`).join(""); }

async function initializeLIFF(){
    try{ await liff.init({ liffId:LIFF_ID }); if(liff.isLoggedIn()){ liffProfile=await liff.getProfile(); let email=""; try{ const idToken=liff.getDecodedIDToken(); if(idToken?.email) email=idToken.email; } catch(e){}
        let sheetProfile=await fetchAPI("getUserProfile",{ lineId:liffProfile.userId });
        if(sheetProfile?.displayName) userProfile={ userId:sheetProfile.lineId, lineName:sheetProfile.lineName, displayName:sheetProfile.displayName, email:sheetProfile.email||email, phone:sheetProfile.phone||"", address:sheetProfile.address||"", pictureUrl:liffProfile.pictureUrl||"", totalSpent:sheetProfile.totalSpent||0, orderCount:sheetProfile.orderCount||0 };
        else userProfile={ userId:liffProfile.userId, lineName:liffProfile.displayName, displayName:liffProfile.displayName, email:email, phone:"", address:"", pictureUrl:liffProfile.pictureUrl||"", totalSpent:0, orderCount:0 };
        await saveUserProfile(userProfile); updateUserUI(); autoFillCheckoutForm();
        orderHistory=await fetchAPI("getUserOrders",{ lineId:userProfile.userId });
        await checkAdminStatus(userProfile.userId);
        await loadStoreSettings();
        if(isAdmin){ await loadAllOrders(); await loadAllUsers(); await loadCategories(); renderTabBar(); }
        else{ await loadCategories(); renderTabBar(); }
        await loadProducts();
    } else liff.login();
    } catch(e){ userProfile={ userId:"guest", lineName:"Guest", displayName:"Guest" }; updateUserUI(); loadCategories(); renderTabBar(); loadProducts(); }
}

.timestamp}</p></div><div class="text-right"><p class="text-rose-500 font-bold text-sm">${formatPrice(o.total)}</p><p class="text-xs text-gray-400">${o.items.length} รายการ</p></div></div></div>`).join('')}${orderHistory.length>5?`<button id="viewAllOrdersBtn" class="w-full mt-3 text-rose-500 text-sm py-2">ดูทั้งหมด (${orderHistory.length})</button>`:''}</div></div>`;

function showAllOrders(){
    const content=document.getElementById("orderHistoryContent");
    if(!orderHistory.length) content.innerHTML='<p class="text-center py-10">ยังไม่มีประวัติการสั่งซื้อ</p>';
    else content.innerHTML=orderHistory.map(o=>{
        const isPending = (o.status || '').toLowerCase() === 'pending';
        let slipButton='';
        if(isPending && !o.slipUrl){
            slipButton=`<button class="w-full mt-2 bg-blue-500 text-white py-2 rounded-xl text-sm" onclick="uploadSlip('${o.orderId}', ${o.total}, '${escapeHtml(o.name)}')"><i class="fas fa-upload mr-1"></i>แนบสลิปโอนเงิน</button>`;
        }
        let slipLink='';
        if(o.slipUrl){
            slipLink=`<div class="mt-2 text-xs"><a href="${o.slipUrl}" target="_blank" class="text-blue-500"><i class="fas fa-receipt"></i> ดูสลิปที่แนบ</a></div>`;
        }
        let trackingHtml = '';
        if(o.trackingLink && (o.status === 'Shipped' || o.status === 'Delivered')){
            trackingHtml = `<div class="mt-2 text-xs"><a href="${o.trackingLink}" target="_blank" class="text-green-600"><i class="fas fa-box"></i> ลิงก์ติดตามพัสดุ</a></div>`;
        }
        return `<div class="order-history-card" onclick="viewOrderDetail('${o.orderId}')">
            <div class="flex justify-between"><div><p class="font-semibold text-rose-500">${o.orderId}</p><p class="text-xs text-gray-400">${o.timestamp}</p></div><div class="text-right"><p class="text-rose-500 font-bold">${formatPrice(o.total)}</p><p class="text-xs text-gray-400">${o.status||'สำเร็จ'}</p></div></div>
            <div class="border-t pt-2 mt-2"><p class="text-sm">สินค้า:</p>${o.items.slice(0,2).map(i=>`<div class="flex justify-between text-sm mt-1"><span>${i.name} x ${i.quantity}</span><span>${formatPrice(i.price*i.quantity)}</span></div>`).join('')}${o.items.length>2?`<p class="text-xs text-gray-400 mt-1">และอีก ${o.items.length-2} รายการ</p>`:''}</div>
            ${slipLink}
            ${trackingHtml}
            ${slipButton}
            <button class="w-full mt-3 bg-rose-50 text-rose-500 py-2 rounded-xl text-sm" onclick="event.stopPropagation(); reorderItems('${o.orderId}')"><i class="fas fa-redo-alt mr-1"></i>สั่งซื้ออีกครั้ง</button>
        </div>`;
    }).join('');
    document.getElementById("orderHistoryModal").classList.remove("hidden"); document.getElementById("profileModal").classList.add("hidden");
}
function viewOrderDetail(orderId){
    const o=orderHistory.find(o=>o.orderId===orderId);
    if(!o) return;
    const slipHtml = o.slipUrl ? `<div class="bg-gray-50 rounded-xl p-3 mt-2"><a href="${o.slipUrl}" target="_blank" class="text-blue-500"><i class="fas fa-receipt mr-1"></i>ดูสลิปการโอนเงิน</a></div>` : '';
    const trackingHtml = (o.trackingLink && (o.status === 'Shipped' || o.status === 'Delivered')) ? `<div class="bg-gray-50 rounded-xl p-3 mt-2"><a href="${o.trackingLink}" target="_blank" class="text-green-600"><i class="fas fa-box mr-1"></i>ลิงก์ติดตามพัสดุ</a></div>` : '';
    document.getElementById("orderDetailContent").innerHTML=`<div class="bg-gray-50 rounded-xl p-4 mb-4"><div class="flex justify-between"><div><p class="text-xs text-gray-500">เลขที่</p><p class="font-semibold">${o.orderId}</p></div><div class="text-right"><p class="text-xs text-gray-500">วันที่</p><p class="text-sm">${o.timestamp}</p></div></div><div class="border-t pt-3 mt-2"><p class="text-xs text-gray-500">ผู้รับ</p><p>${o.name||"-"}</p><p>${o.phone||"-"}</p><p>${o.address||"-"}</p></div></div><div class="mb-4"><p class="font-semibold mb-2">รายการสินค้า</p>${o.items.map(i=>`<div class="flex justify-between py-2 border-b"><div><p>${i.name}</p><p class="text-xs text-gray-400">x ${i.quantity}</p></div><p class="text-rose-500">${formatPrice(i.price*i.quantity)}</p></div>`).join('')}</div><div class="bg-gray-50 rounded-xl p-3"><div class="flex justify-between"><span class="font-semibold">ยอดรวม</span><span class="text-xl font-bold text-rose-500">${formatPrice(o.total)}</span></div><div class="flex justify-between mt-2"><span>สถานะ</span><span class="text-green-600"><i class="fas fa-check-circle mr-1"></i>${o.status||"สำเร็จ"}</span></div>${slipHtml}${trackingHtml}</div><button id="reorderFromDetailBtn" class="w-full mt-4 bg-rose-500 text-white py-3 rounded-xl"><i class="fas fa-redo-alt mr-2"></i>สั่งซื้ออีกครั้ง</button>`;
    document.getElementById("orderDetailModal").classList.remove("hidden");
    document.getElementById("reorderFromDetailBtn")?.addEventListener("click",()=>{ reorderItems(orderId); document.getElementById("orderDetailModal").classList.add("hidden"); });
}
async function reorderItems(orderId){ const o=orderHistory.find(o=>o.orderId===orderId); if(o?.items){ o.items.forEach(i=>{ const p=products.find(p=>p.id===i.id); if(p) addToCart(p); }); showToast("เพิ่มสินค้าลงตะกร้าเรียบร้อย"); closeAllModals(); } }
function openCart(){ updateCartUI(); document.getElementById("cartSidebar").classList.remove("hidden"); closeRadialMenu(); }
function closeCart(){ document.getElementById("cartSidebar").classList.add("hidden"); }
function closeAllModals(){ ["profileModal","editProfileModal","orderHistoryModal","orderDetailModal","adminPanelModal","productFormModal","categoryFormModal","orderStatusModal","userRoleModal","checkoutModal","qrModal"].forEach(id=>document.getElementById(id)?.classList.add("hidden")); if(qrTimerInterval) clearInterval(qrTimerInterval); }
function toggleRadialMenu(){ const rm=document.getElementById("radialMenu"); if(isRadialOpen){ rm.classList.add("hidden"); isRadialOpen=false; } else { rm.classList.remove("hidden"); isRadialOpen=true; } }
function closeRadialMenu(){ document.getElementById("radialMenu").classList.add("hidden"); isRadialOpen=false; }
async function openAdminPanel(){ if(!isAdmin){ showToast("ไม่มีสิทธิ์เข้าถึง","error"); return; } await loadAllOrders(); await loadAdminProducts(); await loadAdminCategories(); await loadAllUsers(); await loadBotTokenSetting(); await loadAdminIdsSetting(); document.getElementById("adminPanelModal").classList.remove("hidden"); closeRadialMenu(); }

// ========== Event Listeners ==========
document.addEventListener("DOMContentLoaded", async () => {
    await initializeLIFF();
    document.querySelectorAll(".modal-container").forEach(modal=>{ new MutationObserver(updateDockVisibility).observe(modal,{ attributes:true, attributeFilter:["class"] }); });
    updateDockVisibility();
    document.getElementById("searchInput")?.addEventListener("input",(e)=>{ searchQuery=e.target.value; renderProducts(); });
    document.getElementById("filterBtn")?.addEventListener("click",()=>document.getElementById("categoryFilter").scrollIntoView({ behavior:"smooth" }));
    document.getElementById("cartIcon")?.addEventListener("click",openCart);
    document.getElementById("closeCart")?.addEventListener("click",closeCart);
    document.getElementById("cartOverlay")?.addEventListener("click",closeCart);
    document.getElementById("userAvatar")?.addEventListener("click",showProfileModal);
    document.getElementById("checkoutBtn")?.addEventListener("click",()=>{ if(cart.length) document.getElementById("checkoutModal").classList.remove("hidden"); else showToast("ตะกร้าว่าง","error"); closeRadialMenu(); });
    document.getElementById("closeCheckoutModal")?.addEventListener("click",()=>document.getElementById("checkoutModal").classList.add("hidden"));
    document.getElementById("checkoutOverlay")?.addEventListener("click",()=>document.getElementById("checkoutModal").classList.add("hidden"));
    document.getElementById("cancelCheckout")?.addEventListener("click",()=>document.getElementById("checkoutModal").classList.add("hidden"));
    document.getElementById("confirmOrder")?.addEventListener("click",submitOrder);
    document.getElementById("closeProfile")?.addEventListener("click",()=>document.getElementById("profileModal").classList.add("hidden"));
    document.getElementById("profileOverlay")?.addEventListener("click",()=>document.getElementById("profileModal").classList.add("hidden"));
    document.getElementById("closeEditProfileModal")?.addEventListener("click",()=>document.getElementById("editProfileModal").classList.add("hidden"));
    document.getElementById("editProfileOverlay")?.addEventListener("click",()=>document.getElementById("editProfileModal").classList.add("hidden"));
    document.getElementById("cancelEditProfile")?.addEventListener("click",()=>document.getElementById("editProfileModal").classList.add("hidden"));
    document.getElementById("saveEditProfile")?.addEventListener("click",saveEditedProfile);
    document.getElementById("closeOrderHistory")?.addEventListener("click",()=>document.getElementById("orderHistoryModal").classList.add("hidden"));
    document.getElementById("orderHistoryOverlay")?.addEventListener("click",()=>document.getElementById("orderHistoryModal").classList.add("hidden"));
    document.getElementById("closeOrderDetail")?.addEventListener("click",()=>document.getElementById("orderDetailModal").classList.add("hidden"));
    document.getElementById("orderDetailOverlay")?.addEventListener("click",()=>document.getElementById("orderDetailModal").classList.add("hidden"));
    document.getElementById("fab")?.addEventListener("click",toggleRadialMenu);
    document.getElementById("closeAdminPanel")?.addEventListener("click",()=>document.getElementById("adminPanelModal").classList.add("hidden"));
    document.getElementById("adminPanelOverlay")?.addEventListener("click",()=>document.getElementById("adminPanelModal").classList.add("hidden"));
    document.querySelectorAll(".admin-sub-tab").forEach(tab=>{ tab.addEventListener("click",()=>{ document.querySelectorAll(".admin-sub-tab").forEach(t=>{ t.classList.remove("active"); }); tab.classList.add("active"); const target=tab.dataset.tab;
        document.getElementById("adminOrdersSection").classList.add("hidden"); document.getElementById("adminProductsSection").classList.add("hidden"); document.getElementById("adminCategoriesSection").classList.add("hidden"); document.getElementById("adminUsersSection").classList.add("hidden"); document.getElementById("adminSettingsSection").classList.add("hidden");
        if(target==="orders") document.getElementById("adminOrdersSection").classList.remove("hidden");
        else if(target==="products"){ document.getElementById("adminProductsSection").classList.remove("hidden"); loadAdminProducts(); }
        else if(target==="categories"){ document.getElementById("adminCategoriesSection").classList.remove("hidden"); loadAdminCategories(); }
        else if(target==="users"){ document.getElementById("adminUsersSection").classList.remove("hidden"); loadAllUsers(); }
        else if(target==="settings"){ document.getElementById("adminSettingsSection").classList.remove("hidden"); loadBotTokenSetting(); loadAdminIdsSetting(); loadStoreSettings(); }
    }); });
    document.getElementById("refreshOrdersBtn")?.addEventListener("click",async()=>await loadAllOrders());
    document.getElementById("refreshUsersBtn")?.addEventListener("click",async()=>await loadAllUsers());
    document.getElementById("addProductBtn")?.addEventListener("click",addNewProduct);
    document.getElementById("addCategoryBtn")?.addEventListener("click",addNewCategory);
    document.getElementById("closeProductForm")?.addEventListener("click",()=>document.getElementById("productFormModal").classList.add("hidden"));
    document.getElementById("productFormOverlay")?.addEventListener("click",()=>document.getElementById("productFormModal").classList.add("hidden"));
    document.getElementById("cancelProductFormBtn")?.addEventListener("click",()=>document.getElementById("productFormModal").classList.add("hidden"));
    document.getElementById("saveProductBtn")?.addEventListener("click",saveProduct);
    document.getElementById("uploadImageBtn")?.addEventListener("click",()=>document.getElementById("imageFile").click());
    document.getElementById("imageFile")?.addEventListener("change",uploadImageToDrive);
    document.getElementById("closeCategoryForm")?.addEventListener("click",()=>document.getElementById("categoryFormModal").classList.add("hidden"));
    document.getElementById("categoryFormOverlay")?.addEventListener("click",()=>document.getElementById("categoryFormModal").classList.add("hidden"));
    document.getElementById("cancelCategoryFormBtn")?.addEventListener("click",()=>document.getElementById("categoryFormModal").classList.add("hidden"));
    document.getElementById("saveCategoryBtn")?.addEventListener("click",saveCategory);
    document.getElementById("cancelOrderStatusBtn")?.addEventListener("click",()=>document.getElementById("orderStatusModal").classList.add("hidden"));
    document.getElementById("orderStatusOverlay")?.addEventListener("click",()=>document.getElementById("orderStatusModal").classList.add("hidden"));
    document.getElementById("confirmOrderStatusBtn")?.addEventListener("click",updateOrderStatus);
    document.getElementById("cancelUserRoleBtn")?.addEventListener("click",()=>document.getElementById("userRoleModal").classList.add("hidden"));
    document.getElementById("userRoleOverlay")?.addEventListener("click",()=>document.getElementById("userRoleModal").classList.add("hidden"));
    document.getElementById("confirmUserRoleBtn")?.addEventListener("click",saveUserRole);
    document.getElementById("saveBotToken")?.addEventListener("click",saveBotTokenSetting);
    document.getElementById("saveAdminIds")?.addEventListener("click",saveAdminIdsSetting);
    document.getElementById("saveStoreName")?.addEventListener("click",saveStoreNameSetting);
    document.getElementById("savePromptPay")?.addEventListener("click",savePromptPaySetting);
    document.getElementById("testNotifyBtn")?.addEventListener("click",testNotify);
    document.getElementById("closeQrModal")?.addEventListener("click",()=>{ document.getElementById("qrModal").classList.add("hidden"); if(qrTimerInterval) clearInterval(qrTimerInterval); });
    document.getElementById("qrOverlay")?.addEventListener("click",()=>{ document.getElementById("qrModal").classList.add("hidden"); if(qrTimerInterval) clearInterval(qrTimerInterval); });
    document.getElementById("closeQrModalBtn")?.addEventListener("click",()=>{ document.getElementById("qrModal").classList.add("hidden"); if(qrTimerInterval) clearInterval(qrTimerInterval); });
    document.querySelectorAll(".radial-item").forEach(i=>i.addEventListener("click",()=>{ const a=i.dataset.action; if(a==="home"){ window.scrollTo({ top:0 }); closeCart(); closeAllModals(); } else if(a==="search") document.getElementById("searchInput")?.focus(); else if(a==="cart") openCart(); else if(a==="profile") showProfileModal(); else if(a==="category") document.getElementById("categoryFilter").scrollIntoView({ behavior:"smooth" }); else if(a==="admin") openAdminPanel(); closeRadialMenu(); }));
    document.addEventListener("click",(e)=>{ if(isRadialOpen && !e.target.closest(".radial-menu") && !e.target.closest("#fab")) closeRadialMenu(); if(!e.target.closest(".context-menu")) removeContextMenu(); });
    document.querySelectorAll(".dock-item").forEach(d=>d.addEventListener("click",()=>{ document.querySelectorAll(".dock-item").forEach(dd=>dd.classList.remove("active")); d.classList.add("active"); const dck=d.dataset.dock; if(dck==="home"){ closeCart(); closeAllModals(); window.scrollTo({ top:0 }); } else if(dck==="shop"){ closeCart(); closeAllModals(); } else if(dck==="cart") openCart(); else if(dck==="profile") showProfileModal(); }));
});
</script>
