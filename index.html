<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Shop Thailand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #f5f5f5;
      padding-bottom: 80px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .product-card {
      transition: all 0.3s;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
    }
    
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    
    .product-card:active {
      transform: scale(0.98);
    }
    
    .cart-badge {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .slide-in-right {
      animation: slideInRight 0.3s ease-out;
    }
    
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .bounce {
      animation: bounce 0.3s ease;
    }
    
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #f43f5e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #f43f5e;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1);
    }
    
    .btn-rose {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      transition: all 0.3s;
    }
    
    .btn-rose:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
    }
    
    .btn-rose:active {
      transform: translateY(0);
    }
    
    .product-image {
      aspect-ratio: 1;
      object-fit: cover;
      transition: transform 0.5s;
    }
    
    .product-card:hover .product-image {
      transform: scale(1.1);
    }
    
    .image-wrapper {
      overflow: hidden;
      position: relative;
    }
    
    .category-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      z-index: 1;
    }
    
    .dock-item {
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
    }
    
    .dock-item.active {
      color: #f43f5e;
    }
    
    .dock-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 3px;
      background: #f43f5e;
      border-radius: 0 0 3px 3px;
    }
    
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading" class="fixed inset-0 bg-black bg-opacity-60 z-[100] flex items-center justify-center hidden">
  <div class="bg-white rounded-2xl p-8 text-center">
    <div class="loading-spinner"></div>
    <p class="mt-4 text-gray-600 font-medium">กำลังโหลด...</p>
  </div>
</div>

<!-- Main App -->
<div id="app" class="max-w-2xl mx-auto bg-white min-h-screen shadow-xl">
  
  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white shadow-sm">
    <div class="px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-rose-500">🛍️ E-Shop</h1>
        <p class="text-xs text-gray-400">Thailand</p>
      </div>
      <button onclick="openCart()" class="relative p-2 hover:bg-gray-100 rounded-full transition" id="cartBtn">
        <i class="fas fa-shopping-cart text-2xl text-gray-700"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold hidden">
          0
        </span>
      </button>
    </div>
    
    <!-- Search -->
    <div class="px-4 pb-3">
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" placeholder="🔍 ค้นหาสินค้า..."
               class="w-full pl-10 pr-10 py-2.5 bg-gray-100 rounded-xl text-sm focus:bg-white transition">
        <button onclick="clearSearch()" id="clearBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    
    <!-- Categories -->
    <div id="categories" class="px-4 pb-3 flex gap-2 overflow-x-auto scrollbar-hide">
      <!-- โหลดด้วย JavaScript -->
    </div>
  </header>

  <!-- Products Grid -->
  <main class="p-4">
    <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-10">
        <div class="loading-spinner"></div>
        <p class="text-gray-500 mt-2">กำลังโหลดสินค้า...</p>
      </div>
    </div>
  </main>

</div>

<!-- Cart Sidebar -->
<div id="cartSidebar" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeCart()"></div>
  <div class="absolute right-0 top-0 bottom-0 w-full max-w-sm bg-white shadow-2xl flex flex-col slide-in-right">
    
    <!-- Cart Header -->
    <div class="bg-rose-500 text-white p-4 flex justify-between items-center">
      <h2 class="text-lg font-semibold">
        <i class="fas fa-shopping-cart mr-2"></i>ตะกร้าสินค้า
      </h2>
      <button onclick="closeCart()" class="hover:bg-rose-600 rounded-full p-1 transition">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    
    <!-- Cart Items -->
    <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- โหลดด้วย JavaScript -->
    </div>
    
    <!-- Cart Footer -->
    <div class="border-t p-4 bg-white">
      <div class="flex justify-between items-center mb-4">
        <span class="text-gray-600">💰 รวมทั้งสิ้น</span>
        <span id="cartTotal" class="text-2xl font-bold text-rose-500">฿0</span>
      </div>
      <button onclick="openCheckout()" class="btn-rose w-full text-white py-3.5 rounded-xl font-medium text-lg">
        🧾 สั่งซื้อเลย
      </button>
    </div>
  </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeCheckout()"></div>
  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-6 slide-in-right max-h-[90vh] overflow-y-auto">
    
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold">📝 ข้อมูลการสั่งซื้อ</h2>
      <button onclick="closeCheckout()" class="text-gray-400 hover:text-gray-600 p-1">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    
    <form id="orderForm" onsubmit="handleSubmitOrder(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล *</label>
        <input type="text" id="custName" required placeholder="👤 กรุณากรอกชื่อ-นามสกุล"
               class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
        <input type="email" id="custEmail" placeholder="📧 example@email.com"
               class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทร *</label>
        <input type="tel" id="custPhone" required placeholder="📱 0812345678"
               class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ที่อยู่จัดส่ง *</label>
        <textarea id="custAddress" required rows="3" placeholder="🏠 กรุณากรอกที่อยู่สำหรับจัดส่ง"
                  class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition"></textarea>
      </div>
      
      <!-- Order Summary -->
      <div class="bg-gray-50 rounded-xl p-4">
        <h3 class="font-semibold mb-3">📋 สรุปคำสั่งซื้อ</h3>
        <div id="orderSummary" class="space-y-2 text-sm"></div>
        <div class="border-t mt-3 pt-3 flex justify-between items-center">
          <span class="font-bold">รวมทั้งสิ้น</span>
          <span id="checkoutTotal" class="text-xl font-bold text-rose-500">฿0</span>
        </div>
      </div>
      
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeCheckout()"
                class="flex-1 border-2 border-gray-300 hover:border-gray-400 py-3.5 rounded-xl font-medium transition">
          ❌ ยกเลิก
        </button>
        <button type="submit"
                class="btn-rose flex-1 text-white py-3.5 rounded-xl font-medium">
          ✅ ยืนยันการสั่งซื้อ
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-30">
  <div class="flex justify-around max-w-2xl mx-auto">
    <div class="dock-item active flex flex-col items-center py-2 px-6" data-tab="home" onclick="switchTab('home')">
      <i class="fas fa-home text-xl"></i>
      <span class="text-xs mt-1">หน้าแรก</span>
    </div>
    <div class="dock-item flex flex-col items-center py-2 px-6 text-gray-500" data-tab="cart" onclick="switchTab('cart')">
      <i class="fas fa-shopping-cart text-xl"></i>
      <span class="text-xs mt-1">ตะกร้า</span>
    </div>
    <div class="dock-item flex flex-col items-center py-2 px-6 text-gray-500" data-tab="profile" onclick="switchTab('profile')">
      <i class="fas fa-user text-xl"></i>
      <span class="text-xs mt-1">โปรไฟล์</span>
    </div>
  </div>
</nav>

<script>
// ============================================
// STATE MANAGEMENT
// ============================================
let products = [];
let cart = [];
let currentCategory = 'all';
let searchQuery = '';

// ============================================
// UTILITY FUNCTIONS
// ============================================
function showLoading() {
  document.getElementById('loading').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

function formatPrice(price) {
  return '฿' + Number(price).toLocaleString('th-TH');
}

function showToast(message, icon = 'success') {
  Swal.fire({
    title: message,
    icon: icon,
    toast: true,
    position: 'top-end',
    showConfirmButton: false,
    timer: 2000,
    timerProgressBar: true
  });
}

function getCurrentUrl() {
  // ใช้ URL ปัจจุบันของ Web App
  return window.location.origin + window.location.pathname;
}

// ============================================
// API FUNCTIONS
// ============================================
async function fetchProducts() {
  try {
    const url = getCurrentUrl() + '?action=getProducts';
    console.log('📡 Fetching:', url);
    
    const response = await fetch(url);
    console.log('📥 Status:', response.status);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    console.log('📦 Products loaded:', data.length);
    
    products = data;
    return true;
    
  } catch (error) {
    console.error('❌ Error:', error);
    throw error;
  }
}

async function submitOrderAPI(orderData) {
  try {
    const url = getCurrentUrl();
    console.log('📤 Sending order to:', url);
    
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    });
    
    console.log('📥 Response status:', response.status);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const result = await response.json();
    console.log('📦 Order result:', result);
    
    return result;
    
  } catch (error) {
    console.error('❌ Order error:', error);
    throw error;
  }
}

// ============================================
// UI RENDERING
// ============================================
function renderCategories() {
  const categories = ['all', ...new Set(products.map(p => p.category).filter(Boolean))];
  const container = document.getElementById('categories');
  
  container.innerHTML = categories.map(cat => `
    <button onclick="filterByCategory('${cat}')" 
            class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all
                   ${cat === currentCategory ? 'bg-rose-500 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
      ${cat === 'all' ? '✨ ทั้งหมด' : cat}
    </button>
  `).join('');
}

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  
  // กรองสินค้า
  let filtered = products.filter(p => {
    const matchCategory = currentCategory === 'all' || p.category === currentCategory;
    const matchSearch = !searchQuery || 
                       p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                       p.category.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCategory && matchSearch;
  });
  
  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="col-span-full text-center py-10 fade-in">
        <div class="text-6xl mb-4">🔍</div>
        <p class="text-gray-500">ไม่พบสินค้า</p>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = filtered.map((product, index) => `
    <div class="product-card bg-white border fade-in" style="animation-delay: ${index * 0.05}s">
      <div class="image-wrapper">
        <img src="${product.image}" alt="${product.name}" 
             class="product-image w-full h-48"
             loading="lazy"
             onerror="this.src='https://via.placeholder.com/400/f43f5e/ffffff?text=${encodeURIComponent(product.name)}'">
        <span class="category-tag">${product.category}</span>
      </div>
      <div class="p-3">
        <h3 class="font-semibold text-gray-800 mb-1 line-clamp-2 text-sm">${product.name}</h3>
        <div class="text-rose-500 font-bold text-lg mb-2">${formatPrice(product.price)}</div>
        <button onclick='addToCart(${JSON.stringify(product).replace(/'/g, "\\'")})' 
                class="w-full bg-rose-500 hover:bg-rose-600 text-white py-2 rounded-xl font-medium transition-all active:scale-95">
          <i class="fas fa-cart-plus mr-1"></i> หยิบใส่ตะกร้า
        </button>
      </div>
    </div>
  `).join('');
}

function renderCart() {
  const container = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  const badge = document.getElementById('cartBadge');
  
  const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
  const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  
  // อัพเดท badge
  if (totalItems > 0) {
    badge.textContent = totalItems;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  
  // อัพเดทยอดรวม
  totalEl.textContent = formatPrice(totalPrice);
  
  // แสดงรายการ
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="text-center py-12">
        <div class="text-6xl mb-4">🛒</div>
        <p class="text-gray-500 text-lg">ตะกร้าว่างเปล่า</p>
        <p class="text-gray-400 text-sm mt-2">เลือกซื้อสินค้าก่อนนะครับ</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = cart.map(item => `
    <div class="bg-gray-50 rounded-2xl p-4 fade-in">
      <div class="flex gap-4">
        <img src="${item.image}" alt="${item.name}"
             class="w-20 h-20 rounded-xl object-cover"
             onerror="this.src='https://via.placeholder.com/80'">
        <div class="flex-1 min-w-0">
          <h4 class="font-semibold text-gray-800 mb-1 truncate">${item.name}</h4>
          <p class="text-rose-500 font-bold">${formatPrice(item.price)}</p>
          <div class="flex items-center gap-3 mt-2">
            <button onclick="updateQty('${item.id}', -1)" 
                    class="w-8 h-8 rounded-full bg-white shadow-sm hover:bg-gray-100 flex items-center justify-center">
              <i class="fas fa-minus text-xs"></i>
            </button>
            <span class="font-bold text-lg min-w-[2rem] text-center">${item.quantity}</span>
            <button onclick="updateQty('${item.id}', 1)" 
                    class="w-8 h-8 rounded-full bg-white shadow-sm hover:bg-gray-100 flex items-center justify-center">
              <i class="fas fa-plus text-xs"></i>
            </button>
            <button onclick="removeFromCart('${item.id}')" 
                    class="ml-auto text-red-400 hover:text-red-600 p-2">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// ============================================
// CART OPERATIONS
// ============================================
function addToCart(product) {
  const existingItem = cart.find(item => item.id === product.id);
  
  if (existingItem) {
    existingItem.quantity++;
  } else {
    cart.push({ ...product, quantity: 1 });
  }
  
  renderCart();
  
  // Animation
  const cartBtn = document.getElementById('cartBtn');
  cartBtn.classList.add('bounce');
  setTimeout(() => cartBtn.classList.remove('bounce'), 300);
  
  showToast(`✅ เพิ่ม ${product.name} ลงตะกร้าแล้ว`);
}

function updateQty(productId, change) {
  const item = cart.find(item => item.id === productId);
  if (!item) return;
  
  item.quantity += change;
  
  if (item.quantity <= 0) {
    removeFromCart(productId);
  } else {
    renderCart();
  }
}

function removeFromCart(productId) {
  const item = cart.find(item => item.id === productId);
  cart = cart.filter(item => item.id !== productId);
  renderCart();
  
  if (item) {
    showToast(`🗑️ ลบ ${item.name} ออกจากตะกร้า`, 'info');
  }
}

// ============================================
// MODAL CONTROLS
// ============================================
function openCart() {
  renderCart();
  document.getElementById('cartSidebar').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeCart() {
  document.getElementById('cartSidebar').classList.add('hidden');
  document.body.style.overflow = '';
}

function openCheckout() {
  if (cart.length === 0) {
    showToast('⚠️ กรุณาเลือกสินค้าก่อน', 'warning');
    return;
  }
  
  // แสดงสรุป
  const summary = document.getElementById('orderSummary');
  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  
  summary.innerHTML = cart.map(item => `
    <div class="flex justify-between">
      <span>${item.name} x ${item.quantity}</span>
      <span>${formatPrice(item.price * item.quantity)}</span>
    </div>
  `).join('');
  
  document.getElementById('checkoutTotal').textContent = formatPrice(total);
  document.getElementById('checkoutModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeCheckout() {
  document.getElementById('checkoutModal').classList.add('hidden');
  document.body.style.overflow = '';
}

// ============================================
// ORDER SUBMISSION
// ============================================
async function handleSubmitOrder(e) {
  e.preventDefault();
  
  if (cart.length === 0) {
    showToast('⚠️ ไม่มีสินค้าในตะกร้า', 'warning');
    return;
  }
  
  // รับข้อมูลฟอร์ม
  const name = document.getElementById('custName').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  
  // ตรวจสอบ
  if (!name || !phone || !address) {
    showToast('⚠️ กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
    return;
  }
  
  // เตรียมข้อมูล
  const orderData = {
    name,
    email,
    phone,
    address,
    items: cart.map(item => ({
      id: item.id,
      name: item.name,
      price: item.price,
      quantity: item.quantity
    })),
    total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0)
  };
  
  showLoading();
  
  try {
    const result = await submitOrderAPI(orderData);
    
    if (result.success) {
      // ล้างตะกร้า
      cart = [];
      renderCart();
      
      // ปิดหน้าต่าง
      closeCheckout();
      closeCart();
      
      // ล้างฟอร์ม
      document.getElementById('orderForm').reset();
      
      // แสดงผลสำเร็จ
      await Swal.fire({
        title: '🎉 สั่งซื้อสำเร็จ!',
        html: `
          <div class="text-left">
            <p class="mb-2">เลขที่คำสั่งซื้อ: <strong>${result.orderId}</strong></p>
            <p class="text-gray-500">ขอบคุณที่ใช้บริการครับ 🙏</p>
          </div>
        `,
        icon: 'success',
        confirmButtonText: 'ตกลง',
        confirmButtonColor: '#f43f5e'
      });
      
      // กลับหน้าแรก
      switchTab('home');
      
    } else {
      throw new Error(result.error || 'เกิดข้อผิดพลาด');
    }
  } catch (error) {
    Swal.fire({
      title: '❌ เกิดข้อผิดพลาด',
      text: error.message || 'กรุณาลองใหม่อีกครั้ง',
      icon: 'error',
      confirmButtonText: 'ตกลง',
      confirmButtonColor: '#f43f5e'
    });
  } finally {
    hideLoading();
  }
}

// ============================================
// CATEGORY & SEARCH
// ============================================
function filterByCategory(category) {
  currentCategory = category;
  renderCategories();
  renderProducts();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.add('hidden');
  renderProducts();
}

// ============================================
// TAB SWITCHING
// ============================================
function switchTab(tab) {
  // อัพเดท active state
  document.querySelectorAll('.dock-item').forEach(item => {
    item.classList.remove('active');
    item.classList.add('text-gray-500');
  });
  
  const activeItem = document.querySelector(`[data-tab="${tab}"]`);
  if (activeItem) {
    activeItem.classList.add('active');
    activeItem.classList.remove('text-gray-500');
  }
  
  // จัดการตาม tab
  switch(tab) {
    case 'home':
      closeCart();
      closeCheckout();
      document.body.style.overflow = '';
      break;
    case 'cart':
      openCart();
      break;
    case 'profile':
      Swal.fire({
        title: '👤 โปรไฟล์',
        html: `
          <p>ยินดีต้อนรับสู่ E-Shop Thailand</p>
          <p class="text-sm text-gray-500 mt-2">จำนวนสินค้าในตะกร้า: ${cart.reduce((sum, item) => sum + item.quantity, 0)} ชิ้น</p>
        `,
        icon: 'info',
        confirmButtonText: 'ตกลง',
        confirmButtonColor: '#f43f5e'
      });
      break;
  }
}

// ============================================
// INITIALIZATION
// ============================================
async function init() {
  console.log('🚀 Starting E-Shop...');
  showLoading();
  
  try {
    await fetchProducts();
    renderCategories();
    renderProducts();
    renderCart();
    console.log('✅ Ready!');
  } catch (error) {
    console.error('❌ Init error:', error);
    document.getElementById('productsGrid').innerHTML = `
      <div class="col-span-full text-center py-10">
        <div class="text-6xl mb-4">😕</div>
        <p class="text-red-500 font-medium mb-2">ไม่สามารถโหลดสินค้าได้</p>
        <p class="text-gray-400 text-sm mb-4">${error.message}</p>
        <button onclick="init()" class="bg-rose-500 text-white px-6 py-2 rounded-xl hover:bg-rose-600 transition">
          🔄 ลองใหม่อีกครั้ง
        </button>
      </div>
    `;
  } finally {
    hideLoading();
  }
}

// ============================================
// EVENT LISTENERS
// ============================================
document.addEventListener('DOMContentLoaded', () => {
  
  // เริ่มต้นแอป
  init();
  
  // ค้นหา
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    const clearBtn = document.getElementById('clearBtn');
    if (searchQuery) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }
    renderProducts();
  });
  
  // ปุ่มล้างค้นหา
  document.getElementById('clearBtn').addEventListener('click', clearSearch);
  
  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeCart();
      closeCheckout();
    }
  });
  
});

console.log('📦 E-Shop Thailand - โหลดสคริปต์เสร็จสมบูรณ์');
</script>
