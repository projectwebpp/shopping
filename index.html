<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #f5f5f5; 
            padding-bottom: 70px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .product-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .product-card:active {
            transform: scale(0.98);
        }
        
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f43f5e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .bg-rose-gradient {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        }
        
        .product-image {
            aspect-ratio: 1;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image {
            transform: scale(1.1);
        }
        
        .image-container {
            overflow: hidden;
            position: relative;
        }
        
        .category-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            z-index: 1;
        }
        
        .dock-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dock-item:hover {
            color: #f43f5e;
            transform: translateY(-2px);
        }
        .dock-item.active {
            color: #f43f5e;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #f43f5e;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1);
        }
        
        .btn-rose {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            transition: all 0.3s ease;
        }
        .btn-rose:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        .btn-rose:active {
            transform: translateY(0);
        }
        
        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-8 text-center shadow-xl">
        <div class="loading-spinner mb-4"></div>
        <p class="text-gray-600 font-medium">กำลังโหลด...</p>
    </div>
</div>

<!-- Main Container -->
<div class="max-w-2xl mx-auto min-h-screen">
    
    <!-- Header -->
    <header class="bg-white sticky top-0 z-40 shadow-sm">
        <div class="px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold bg-rose-gradient bg-clip-text text-transparent">
                    🛍️ E-Shop
                </h1>
                <p class="text-xs text-gray-400">Thailand</p>
            </div>
            <button id="cartBtn" class="relative p-2 hover:bg-gray-100 rounded-full transition-colors">
                <i class="fas fa-shopping-cart text-2xl text-gray-700"></i>
                <span id="cartBadge" class="cart-badge hidden">0</span>
            </button>
        </div>
        
        <!-- Search Bar -->
        <div class="px-4 pb-3">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" 
                       placeholder="🔍 ค้นหาสินค้า..." 
                       class="w-full pl-10 pr-10 py-2.5 bg-gray-100 rounded-xl text-sm focus:bg-white transition-colors">
                <button id="clearSearchBtn" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <!-- Category Tabs -->
        <div id="categoryTabs" class="px-4 pb-3 flex gap-2 overflow-x-auto scrollbar-hide">
            <!-- Will be populated by JavaScript -->
        </div>
    </header>

    <!-- Product Grid -->
    <main class="p-4">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Loading skeleton -->
            <div class="col-span-full">
                <div class="text-center py-12">
                    <div class="loading-spinner mb-4"></div>
                    <p class="text-gray-500">กำลังโหลดสินค้า...</p>
                </div>
            </div>
        </div>
    </main>

</div>

<!-- Cart Sidebar -->
<div id="cartSidebar" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="cartOverlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-sm bg-white shadow-xl flex flex-col slide-in">
        
        <!-- Cart Header -->
        <div class="bg-rose-gradient text-white p-4 flex justify-between items-center">
            <h2 class="text-lg font-semibold">
                <i class="fas fa-shopping-cart mr-2"></i>ตะกร้าสินค้า
            </h2>
            <button id="closeCartBtn" class="hover:bg-white hover:bg-opacity-20 rounded-full p-1 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <!-- Cart Items -->
        <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Will be populated by JavaScript -->
        </div>
        
        <!-- Cart Footer -->
        <div class="border-t p-4 bg-white shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600">💰 รวมทั้งสิ้น</span>
                <span id="cartTotalAmount" class="text-2xl font-bold text-rose-500">฿0</span>
            </div>
            <button id="checkoutBtn" 
                    class="btn-rose w-full text-white py-3.5 rounded-xl font-medium text-lg transition-all">
                🧾 สั่งซื้อเลย
            </button>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="checkoutOverlay"></div>
    <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-3xl p-6 slide-in max-h-[90vh] overflow-y-auto">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">📝 ข้อมูลการสั่งซื้อ</h2>
            <button id="closeCheckoutBtn" class="text-gray-400 hover:text-gray-600 p-1">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <form id="checkoutForm" class="space-y-4" onsubmit="return false;">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล *</label>
                <input type="text" id="customerName" required
                       placeholder="👤 กรุณากรอกชื่อ-นามสกุล" 
                       class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition-colors">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล *</label>
                <input type="email" id="customerEmail" required
                       placeholder="📧 example@email.com" 
                       class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition-colors">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทร *</label>
                <input type="tel" id="customerPhone" required
                       placeholder="📱 0812345678" 
                       class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition-colors">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ที่อยู่จัดส่ง *</label>
                <textarea id="customerAddress" required rows="3"
                          placeholder="🏠 กรุณากรอกที่อยู่สำหรับจัดส่ง" 
                          class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 transition-colors"></textarea>
            </div>
            
            <!-- Order Summary -->
            <div class="bg-gray-50 rounded-xl p-4">
                <h3 class="font-semibold mb-3">📋 สรุปคำสั่งซื้อ</h3>
                <div id="orderSummaryList" class="space-y-2 text-sm"></div>
                <div class="border-t mt-3 pt-3 flex justify-between items-center">
                    <span class="font-bold">รวมทั้งสิ้น</span>
                    <span id="checkoutTotalAmount" class="text-xl font-bold text-rose-500">฿0</span>
                </div>
            </div>
            
            <div class="flex gap-3 pt-2">
                <button type="button" id="cancelOrderBtn"
                        class="flex-1 border-2 border-gray-300 hover:border-gray-400 py-3.5 rounded-xl font-medium transition-colors">
                    ❌ ยกเลิก
                </button>
                <button type="submit" id="submitOrderBtn"
                        class="btn-rose flex-1 text-white py-3.5 rounded-xl font-medium transition-all">
                    ✅ ยืนยันการสั่งซื้อ
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-30">
    <div class="flex justify-around max-w-2xl mx-auto">
        <button class="dock-item active flex flex-col items-center py-2 px-6 text-rose-500" data-tab="home">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">หน้าแรก</span>
        </button>
        <button class="dock-item flex flex-col items-center py-2 px-6 text-gray-500" data-tab="cart">
            <i class="fas fa-shopping-cart text-xl"></i>
            <span class="text-xs mt-1">ตะกร้า</span>
        </button>
        <button class="dock-item flex flex-col items-center py-2 px-6 text-gray-500" data-tab="orders">
            <i class="fas fa-clipboard-list text-xl"></i>
            <span class="text-xs mt-1">คำสั่งซื้อ</span>
        </button>
    </div>
</nav>

<script>
// ============================================
// CONFIGURATION
// ============================================
const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE"; // ← ใส่ URL ของคุณที่นี่

// ============================================
// STATE MANAGEMENT
// ============================================
let products = [];
let cart = [];
let currentCategory = 'all';
let searchQuery = '';

// ============================================
// UTILITY FUNCTIONS
// ============================================
function showLoading() {
    document.getElementById('loadingOverlay').classList.remove('hidden');
}

function hideLoading() {
    document.getElementById('loadingOverlay').classList.add('hidden');
}

function formatPrice(price) {
    return '฿' + Number(price).toLocaleString('th-TH');
}

function showToast(message, type = 'success') {
    Swal.fire({
        title: message,
        icon: type,
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
}

// ============================================
// API FUNCTIONS
// ============================================
async function fetchProducts() {
    try {
        const response = await fetch(`${SCRIPT_URL}?action=getProducts`);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const data = await response.json();
        
        if (data.success && Array.isArray(data.products)) {
            products = data.products;
            console.log(`✅ โหลดสินค้าสำเร็จ: ${products.length} รายการ`);
            return true;
        } else {
            throw new Error(data.error || 'รูปแบบข้อมูลไม่ถูกต้อง');
        }
    } catch (error) {
        console.error('❌ โหลดสินค้าล้มเหลว:', error);
        throw error;
    }
}

async function submitOrder(orderData) {
    try {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(orderData)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        return result;
    } catch (error) {
        console.error('❌ ส่งคำสั่งซื้อล้มเหลว:', error);
        throw error;
    }
}

// ============================================
// UI RENDERING
// ============================================
function renderCategories() {
    const categories = ['all', ...new Set(products.map(p => p.category).filter(Boolean))];
    const container = document.getElementById('categoryTabs');
    
    container.innerHTML = categories.map(cat => `
        <button class="category-tab px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap
                       ${cat === currentCategory ? 'bg-rose-500 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}"
                data-category="${cat}">
            ${cat === 'all' ? '✨ ทั้งหมด' : cat}
        </button>
    `).join('');
    
    // Add click handlers
    container.querySelectorAll('.category-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            currentCategory = tab.dataset.category;
            renderCategories();
            renderProducts();
        });
    });
}

function renderProducts() {
    const grid = document.getElementById('productGrid');
    
    // Filter products
    let filtered = products.filter(p => {
        const matchCategory = currentCategory === 'all' || p.category === currentCategory;
        const matchSearch = !searchQuery || 
                          p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          p.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCategory && matchSearch;
    });
    
    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="col-span-full text-center py-12 fade-in">
                <div class="text-6xl mb-4">🔍</div>
                <p class="text-gray-500 text-lg">ไม่พบสินค้า</p>
                ${searchQuery ? '<p class="text-gray-400 text-sm mt-2">ลองเปลี่ยนคำค้นหา</p>' : ''}
            </div>
        `;
        return;
    }
    
    grid.innerHTML = filtered.map((product, index) => `
        <div class="product-card bg-white rounded-2xl overflow-hidden shadow-sm border fade-in"
             style="animation-delay: ${index * 0.05}s">
            <div class="image-container">
                <img src="${product.image}" 
                     alt="${product.name}"
                     class="product-image w-full h-48"
                     loading="lazy"
                     onerror="this.src='https://via.placeholder.com/400x400/f43f5e/ffffff?text=${encodeURIComponent(product.name)}'">
                <span class="category-badge">${product.category}</span>
            </div>
            <div class="p-4">
                <h3 class="font-semibold text-gray-800 mb-2 line-clamp-2">${product.name}</h3>
                <div class="flex items-center justify-between mb-3">
                    <span class="text-rose-500 font-bold text-lg">${formatPrice(product.price)}</span>
                </div>
                <button class="add-to-cart-btn w-full bg-rose-500 hover:bg-rose-600 text-white py-2.5 rounded-xl font-medium transition-all transform hover:scale-105 active:scale-95"
                        data-product-id="${product.id}">
                    <i class="fas fa-cart-plus mr-2"></i>หยิบใส่ตะกร้า
                </button>
            </div>
        </div>
    `).join('');
    
    // Add click handlers for Add to Cart buttons
    grid.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const productId = btn.dataset.productId;
            const product = products.find(p => p.id === productId);
            if (product) {
                addToCart(product);
            }
        });
    });
}

function renderCart() {
    const container = document.getElementById('cartItemsList');
    const totalAmount = document.getElementById('cartTotalAmount');
    const badge = document.getElementById('cartBadge');
    
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    // Update badge
    if (totalItems > 0) {
        badge.textContent = totalItems;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
    
    // Update total
    totalAmount.textContent = formatPrice(totalPrice);
    
    // Render items
    if (cart.length === 0) {
        container.innerHTML = `
            <div class="text-center py-12">
                <div class="text-6xl mb-4">🛒</div>
                <p class="text-gray-500 text-lg">ตะกร้าว่างเปล่า</p>
                <p class="text-gray-400 text-sm mt-2">เลือกซื้อสินค้าก่อนนะครับ</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = cart.map(item => `
        <div class="bg-gray-50 rounded-2xl p-4">
            <div class="flex gap-4">
                <img src="${item.image}" 
                     alt="${item.name}"
                     class="w-20 h-20 rounded-xl object-cover"
                     onerror="this.src='https://via.placeholder.com/80'">
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-800 mb-1">${item.name}</h4>
                    <p class="text-rose-500 font-bold">${formatPrice(item.price)}</p>
                    <div class="flex items-center gap-3 mt-2">
                        <button class="qty-btn w-8 h-8 rounded-full bg-white shadow-sm hover:bg-gray-100 flex items-center justify-center"
                                data-action="decrease" data-product-id="${item.id}">
                            <i class="fas fa-minus text-xs"></i>
                        </button>
                        <span class="font-bold text-lg min-w-[2rem] text-center">${item.quantity}</span>
                        <button class="qty-btn w-8 h-8 rounded-full bg-white shadow-sm hover:bg-gray-100 flex items-center justify-center"
                                data-action="increase" data-product-id="${item.id}">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                        <button class="ml-auto text-red-400 hover:text-red-600 p-2 remove-item-btn"
                                data-product-id="${item.id}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
    
    // Add event handlers
    container.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const productId = btn.dataset.productId;
            const action = btn.dataset.action;
            updateCartItemQuantity(productId, action === 'increase' ? 1 : -1);
        });
    });
    
    container.querySelectorAll('.remove-item-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            removeFromCart(btn.dataset.productId);
        });
    });
}

function renderOrderSummary() {
    const container = document.getElementById('orderSummaryList');
    const total = document.getElementById('checkoutTotalAmount');
    
    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    total.textContent = formatPrice(totalPrice);
    
    container.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center">
            <span class="text-gray-600">${item.name} x ${item.quantity}</span>
            <span class="font-medium">${formatPrice(item.price * item.quantity)}</span>
        </div>
    `).join('');
}

// ============================================
// CART OPERATIONS
// ============================================
function addToCart(product) {
    const existingItem = cart.find(item => item.id === product.id);
    
    if (existingItem) {
        existingItem.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }
    
    renderCart();
    showToast(`✅ เพิ่ม ${product.name} ลงตะกร้าแล้ว`);
    
    // Animation
    const cartBtn = document.getElementById('cartBtn');
    cartBtn.style.transform = 'scale(1.2)';
    setTimeout(() => {
        cartBtn.style.transform = 'scale(1)';
    }, 200);
}

function updateCartItemQuantity(productId, change) {
    const item = cart.find(item => item.id === productId);
    if (!item) return;
    
    item.quantity += change;
    
    if (item.quantity <= 0) {
        removeFromCart(productId);
    } else {
        renderCart();
    }
}

function removeFromCart(productId) {
    const item = cart.find(item => item.id === productId);
    cart = cart.filter(item => item.id !== productId);
    renderCart();
    
    if (item) {
        showToast(`🗑️ ลบ ${item.name} ออกจากตะกร้า`, 'info');
    }
}

// ============================================
// MODAL CONTROLS
// ============================================
function openCart() {
    renderCart();
    document.getElementById('cartSidebar').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeCart() {
    document.getElementById('cartSidebar').classList.add('hidden');
    document.body.style.overflow = '';
}

function openCheckout() {
    if (cart.length === 0) {
        showToast('⚠️ กรุณาเลือกสินค้าก่อน', 'warning');
        return;
    }
    
    renderOrderSummary();
    document.getElementById('checkoutModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeCheckout() {
    document.getElementById('checkoutModal').classList.add('hidden');
    document.body.style.overflow = '';
}

// ============================================
// ORDER SUBMISSION
// ============================================
async function handleSubmitOrder(e) {
    e.preventDefault();
    
    // Validate cart
    if (cart.length === 0) {
        showToast('⚠️ ไม่มีสินค้าในตะกร้า', 'warning');
        return;
    }
    
    // Get form data
    const name = document.getElementById('customerName').value.trim();
    const email = document.getElementById('customerEmail').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const address = document.getElementById('customerAddress').value.trim();
    
    // Validate
    if (!name || !email || !phone || !address) {
        showToast('⚠️ กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
        return;
    }
    
    // Email validation
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('⚠️ รูปแบบอีเมลไม่ถูกต้อง', 'warning');
        return;
    }
    
    // Phone validation
    if (!/^[0-9]{10}$/.test(phone.replace(/-/g, ''))) {
        showToast('⚠️ เบอร์โทรต้องมี 10 หลัก', 'warning');
        return;
    }
    
    // Prepare order data
    const orderData = {
        name,
        email,
        phone,
        address,
        items: cart.map(item => ({
            id: item.id,
            name: item.name,
            price: item.price,
            quantity: item.quantity,
            total: item.price * item.quantity
        })),
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0)
    };
    
    showLoading();
    
    try {
        const result = await submitOrder(orderData);
        
        if (result.success) {
            // Clear cart
            cart = [];
            renderCart();
            
            // Close modals
            closeCheckout();
            
            // Clear form
            document.getElementById('checkoutForm').reset();
            
            // Show success
            await Swal.fire({
                title: '🎉 สั่งซื้อสำเร็จ!',
                html: `
                    <p class="mb-2">เลขที่คำสั่งซื้อ: <strong>${result.orderId}</strong></p>
                    <p class="text-gray-500">ขอบคุณที่ใช้บริการครับ</p>
                `,
                icon: 'success',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: '#f43f5e'
            });
            
        } else {
            throw new Error(result.error || 'เกิดข้อผิดพลาด');
        }
    } catch (error) {
        Swal.fire({
            title: '❌ เกิดข้อผิดพลาด',
            text: error.message || 'กรุณาลองใหม่อีกครั้ง',
            icon: 'error',
            confirmButtonText: 'ตกลง',
            confirmButtonColor: '#f43f5e'
        });
    } finally {
        hideLoading();
    }
}

function switchTab(tab) {
    // Update nav buttons
    document.querySelectorAll('.dock-item').forEach(btn => {
        btn.classList.remove('active', 'text-rose-500');
        btn.classList.add('text-gray-500');
    });
    
    const activeBtn = document.querySelector(`[data-tab="${tab}"]`);
    if (activeBtn) {
        activeBtn.classList.add('active', 'text-rose-500');
        activeBtn.classList.remove('text-gray-500');
    }
    
    // Handle tab actions
    switch(tab) {
        case 'home':
            closeCart();
            closeCheckout();
            document.body.style.overflow = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            break;
        case 'cart':
            openCart();
            break;
        case 'orders':
            Swal.fire({
                title: '📋 คำสั่งซื้อ',
                text: 'กำลังพัฒนาฟีเจอร์นี้',
                icon: 'info',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: '#f43f5e'
            });
            break;
    }
}

// ============================================
// INITIALIZATION
// ============================================
async function init() {
    console.log('🚀 เริ่มต้น E-Shop Thailand...');
    showLoading();
    
    try {
        await fetchProducts();
        renderCategories();
        renderProducts();
        renderCart();
        console.log('✅ พร้อมใช้งาน');
    } catch (error) {
        console.error('❌ เริ่มต้นล้มเหลว:', error);
        document.getElementById('productGrid').innerHTML = `
            <div class="col-span-full text-center py-12">
                <div class="text-6xl mb-4">😕</div>
                <p class="text-red-500 font-medium text-lg mb-2">ไม่สามารถโหลดสินค้าได้</p>
                <p class="text-gray-400 text-sm mb-4">${error.message}</p>
                <button onclick="init()" class="bg-rose-500 text-white px-6 py-2.5 rounded-xl hover:bg-rose-600 transition-colors">
                    🔄 ลองใหม่อีกครั้ง
                </button>
            </div>
        `;
    } finally {
        hideLoading();
    }
}

// ============================================
// EVENT LISTENERS
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    
    // Initialize app
    init();
    
    // Search
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    
    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        clearSearchBtn.classList.toggle('hidden', !searchQuery);
        renderProducts();
    });
    
    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderProducts();
        searchInput.focus();
    });
    
    // Cart
    document.getElementById('cartBtn').addEventListener('click', () => switchTab('cart'));
    document.getElementById('closeCartBtn').addEventListener('click', closeCart);
    document.getElementById('cartOverlay').addEventListener('click', closeCart);
    
    // Checkout
    document.getElementById('checkoutBtn').addEventListener('click', openCheckout);
    document.getElementById('closeCheckoutBtn').addEventListener('click', closeCheckout);
    document.getElementById('cancelOrderBtn').addEventListener('click', closeCheckout);
    document.getElementById('checkoutOverlay').addEventListener('click', closeCheckout);
    
    // Form submission
    document.getElementById('checkoutForm').addEventListener('submit', handleSubmitOrder);
    
    // Navigation
    document.querySelectorAll('.dock-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            switchTab(tab);
        });
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeCart();
            closeCheckout();
        }
    });
    
});
</script>
