<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>E-Shop Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; padding-bottom: 70px; }
        .product-card { transition: transform 0.2s; cursor: pointer; }
        .product-card:active { transform: scale(0.98); }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .dock-item { cursor: pointer; transition: all 0.2s; }
        .dock-item.active { color: #f43f5e; }
        .quantity-btn { width: 32px; height: 32px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .quantity-btn:active { transform: scale(0.9); }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .cat-btn { transition: all 0.2s; cursor: pointer; }
        .admin-btn { cursor: pointer; transition: all 0.2s; }
        .admin-btn:active { transform: scale(0.95); }
        .cart-item { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="bg-white rounded-2xl p-6 flex flex-col items-center">
        <i class="fas fa-spinner fa-pulse text-3xl text-rose-500"></i>
        <p class="mt-2 text-gray-600">กำลังดำเนินการ...</p>
    </div>
</div>

<div class="max-w-md mx-auto">
    <!-- Header -->
    <div class="bg-white sticky top-0 z-50 shadow-sm px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-rose-500">🛍️ E-Shop</h1>
            <p class="text-xs text-gray-400">Thailand</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="adminBtn" class="admin-btn text-gray-500">
                <i class="fas fa-cog text-xl"></i>
            </div>
            <div id="cartIcon" class="relative cursor-pointer">
                <i class="fas fa-shopping-cart text-2xl text-gray-700"></i>
                <span id="cartCount" class="cart-badge">0</span>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="p-4">
        <div class="bg-white rounded-xl shadow-sm border p-3 flex gap-2">
            <i class="fas fa-search text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาสินค้า..." class="flex-1 outline-none text-sm">
        </div>
    </div>

    <!-- Categories -->
    <div id="categoryFilter" class="px-4 flex gap-2 overflow-x-auto whitespace-nowrap pb-2 hide-scrollbar"></div>

    <!-- Products Grid -->
    <div id="productGrid" class="product-grid"></div>
</div>

<!-- Cart Sidebar -->
<div id="cartSidebar" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="cartOverlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-sm bg-white shadow-2xl flex flex-col">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-lg font-semibold"><i class="fas fa-shopping-cart text-rose-500 mr-2"></i>ตะกร้าสินค้า</h2>
            <button id="closeCart" class="text-gray-500"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
            <div class="text-center text-gray-400 py-10"><i class="fas fa-shopping-cart text-4xl mb-3"></i><p>ตะกร้าว่างเปล่า</p></div>
        </div>
        <div class="p-4 border-t bg-white">
            <div class="flex justify-between mb-3">
                <span class="font-semibold">รวมทั้งสิ้น</span>
                <span id="cartTotal" class="text-xl font-bold text-rose-500">0 บาท</span>
            </div>
            <button id="checkoutBtn" class="w-full bg-rose-500 text-white py-3 rounded-xl font-semibold hover:bg-rose-600 transition">🧾 สั่งซื้อเลย</button>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="checkoutOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl max-h-[80vh] overflow-y-auto">
        <div class="p-4 border-b sticky top-0 bg-white">
            <h2 class="text-lg font-semibold">📝 ข้อมูลการสั่งซื้อ</h2>
        </div>
        <div class="p-4 space-y-4">
            <input type="text" id="custName" placeholder="ชื่อ-นามสกุล" class="w-full border rounded-xl p-3">
            <input type="email" id="custEmail" placeholder="อีเมล" class="w-full border rounded-xl p-3">
            <input type="tel" id="custPhone" placeholder="เบอร์โทรศัพท์" class="w-full border rounded-xl p-3">
            <textarea id="custAddress" placeholder="ที่อยู่จัดส่ง" class="w-full border rounded-xl p-3" rows="3"></textarea>
            <div class="flex gap-3 pt-2">
                <button id="cancelCheckout" class="flex-1 border border-gray-300 py-3 rounded-xl">ยกเลิก</button>
                <button id="confirmOrder" class="flex-1 bg-rose-500 text-white py-3 rounded-xl">✅ ยืนยัน</button>
            </div>
        </div>
    </div>
</div>

<!-- Admin Modal -->
<div id="adminModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="adminOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-lg font-semibold"><i class="fas fa-database text-rose-500 mr-2"></i>จัดการระบบ</h2>
            <button id="closeAdmin" class="text-gray-500"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-4 space-y-4">
            <div class="bg-blue-50 rounded-xl p-3 text-sm text-blue-700">
                <i class="fas fa-info-circle mr-1"></i>
                ข้อมูลคำสั่งซื้อถูกบันทึกในเครื่องของคุณ
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button id="viewOrdersBtn" class="bg-purple-500 text-white py-3 rounded-xl font-semibold">
                    <i class="fas fa-list mr-2"></i>ดูประวัติคำสั่งซื้อ
                </button>
                <button id="clearOrdersBtn" class="bg-red-500 text-white py-3 rounded-xl font-semibold">
                    <i class="fas fa-trash mr-2"></i>ล้างข้อมูลทั้งหมด
                </button>
            </div>
            <div class="bg-gray-50 rounded-xl p-3 text-xs text-gray-600">
                <i class="fas fa-database mr-1"></i>
                จำนวนคำสั่งซื้อ: <span id="orderCount">0</span> รายการ
            </div>
        </div>
    </div>
</div>

<!-- Floating Button -->
<div class="fixed bottom-20 right-4 z-40">
    <button id="fabButton" class="w-14 h-14 bg-rose-500 rounded-full shadow-lg text-white flex items-center justify-center hover:bg-rose-600 transition">
        <i class="fas fa-plus text-2xl"></i>
    </button>
</div>

<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-40">
    <div class="dock-item text-center flex-1 py-1 active text-rose-500" data-tab="home">
        <i class="fas fa-home text-xl"></i>
        <div class="text-xs">หน้าแรก</div>
    </div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="cart">
        <i class="fas fa-shopping-cart text-xl"></i>
        <div class="text-xs">ตะกร้า</div>
    </div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="profile">
        <i class="fas fa-user text-xl"></i>
        <div class="text-xs">โปรไฟล์</div>
    </div>
</div>

<script>
// ============================================
// CONFIGURATION
// ============================================
const API_URL = "https://script.google.com/macros/s/AKfycbz-Eeftf2a057_Nu7kNivs41eAHH0EqvGzs4Z3spO3jS3QiuGUjyKMaafxF0DUarLb9/exec";

// ============================================
// สินค้าทั้งหมด (Hardcode ตามที่ต้องการ)
// ============================================
const PRODUCTS = [
    { id: "P001", name: "เสื้อเชิ้ตผู้ชายคอปก", price: 399, image: "https://picsum.photos/id/20/200/200", category: "เสื้อผ้า" },
    { id: "P002", name: "กางเกงยีนส์สลิมฟิต", price: 599, image: "https://picsum.photos/id/26/200/200", category: "เสื้อผ้า" },
    { id: "P003", name: "รองเท้าผ้าใบสไตล์วินเทจ", price: 899, image: "https://picsum.photos/id/0/200/200", category: "รองเท้า" },
    { id: "P004", name: "หมวกแก๊ปผู้ชาย", price: 199, image: "https://picsum.photos/id/1/200/200", category: "เครื่องประดับ" },
    { id: "P005", name: "กระเป๋าเป้สะพายหลัง", price: 1290, image: "https://picsum.photos/id/133/200/200", category: "กระเป๋า" },
    { id: "P006", name: "นาฬิกาข้อมือสปอร์ต", price: 2490, image: "https://picsum.photos/id/82/200/200", category: "เครื่องประดับ" },
    { id: "P007", name: "เสื้อฮู้ดผ้าฝ้าย", price: 459, image: "https://picsum.photos/id/24/200/200", category: "เสื้อผ้า" },
    { id: "P008", name: "แก้วน้ำสแตนเลส", price: 299, image: "https://picsum.photos/id/30/200/200", category: "ของใช้" },
    { id: "P009", name: "หูฟังบลูทูธ", price: 1590, image: "https://picsum.photos/id/1/200/200", category: "อิเล็กทรอนิกส์" },
    { id: "P010", name: "พาวเวอร์แบงค์ 20000mAh", price: 890, image: "https://picsum.photos/id/0/200/200", category: "อิเล็กทรอนิกส์" }
];

// ============================================
// Global Variables
// ============================================
let cart = [];
let currentCategory = "all";
let searchQuery = "";

// ============================================
// Utility Functions
// ============================================
function showLoading() { document.getElementById("loadingOverlay")?.classList.remove("hidden"); }
function hideLoading() { document.getElementById("loadingOverlay")?.classList.add("hidden"); }
function formatPrice(price) { return price.toLocaleString("th-TH") + " บาท"; }
function showToast(title, icon = "success") {
    Swal.fire({ title, icon, toast: true, position: "top-end", showConfirmButton: false, timer: 1500 });
}

// ============================================
// Render Products
// ============================================
function renderProducts() {
    let filtered = PRODUCTS.filter(p => currentCategory === "all" || p.category === currentCategory);
    if (searchQuery.trim()) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
    }
    
    const grid = document.getElementById("productGrid");
    if (!grid) return;
    
    if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">🔍 ไม่พบสินค้า</div>`;
        return;
    }
    
    grid.innerHTML = filtered.map(product => `
        <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm border">
            <img src="${product.image}" class="w-full h-32 object-cover" onerror="this.src='https://picsum.photos/id/20/200/200'">
            <div class="p-2">
                <div class="text-xs text-gray-400">${product.category}</div>
                <div class="font-medium text-sm truncate">${product.name}</div>
                <div class="text-rose-500 font-bold text-sm">${formatPrice(product.price)}</div>
                <button onclick='addToCart(${JSON.stringify(product)})' class="w-full mt-2 bg-rose-500 text-white py-1.5 rounded-lg text-sm hover:bg-rose-600 transition">
                    <i class="fas fa-cart-plus mr-1"></i> หยิบใส่ตะกร้า
                </button>
            </div>
        </div>
    `).join("");
}

function setupCategories() {
    const categories = ["all", ...new Set(PRODUCTS.map(p => p.category))];
    const container = document.getElementById("categoryFilter");
    if (!container) return;
    
    container.innerHTML = categories.map(cat => `
        <button data-cat="${cat}" class="cat-btn px-4 py-1.5 rounded-full text-sm ${cat === "all" ? "bg-rose-500 text-white" : "bg-gray-100 text-gray-700"}">
            ${cat === "all" ? "✨ ทั้งหมด" : cat}
        </button>
    `).join("");
    
    document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".cat-btn").forEach(b => {
                b.classList.remove("bg-rose-500", "text-white");
                b.classList.add("bg-gray-100", "text-gray-700");
            });
            btn.classList.add("bg-rose-500", "text-white");
            currentCategory = btn.dataset.cat;
            renderProducts();
        };
    });
}

// ============================================
// Cart Functions
// ============================================
function addToCart(product) {
    const existing = cart.find(item => item.id === product.id);
    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({ ...product, quantity: 1 });
    }
    updateCartUI();
    showToast("✅ " + product.name + " ใส่ตะกร้าแล้ว");
}

function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    updateCartUI();
    showToast("🗑️ ลบสินค้าออกจากตะกร้า");
}

function updateQuantity(productId, delta) {
    const item = cart.find(item => item.id === productId);
    if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
            removeFromCart(productId);
        } else {
            updateCartUI();
        }
    }
}

function updateCartUI() {
    const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").innerText = cartCount;
    
    const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    document.getElementById("cartTotal").innerHTML = formatPrice(cartTotal);
    
    const cartItemsContainer = document.getElementById("cartItems");
    if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fas fa-shopping-cart text-4xl mb-3"></i><p>ตะกร้าว่างเปล่า</p></div>`;
        return;
    }
    
    cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item flex gap-3 bg-gray-50 rounded-xl p-3">
            <img src="${item.image}" class="w-16 h-16 rounded-lg object-cover">
            <div class="flex-1">
                <div class="font-medium text-sm">${item.name}</div>
                <div class="text-rose-500 text-sm">${formatPrice(item.price)}</div>
                <div class="flex items-center gap-2 mt-2">
                    <button class="quantity-btn" onclick="updateQuantity('${item.id}', -1)"><i class="fas fa-minus text-xs"></i></button>
                    <span class="text-sm w-8 text-center">${item.quantity}</span>
                    <button class="quantity-btn" onclick="updateQuantity('${item.id}', 1)"><i class="fas fa-plus text-xs"></i></button>
                    <button onclick="removeFromCart('${item.id}')" class="ml-auto text-red-400"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        </div>
    `).join("");
}

// ============================================
// Order Management (localStorage)
// ============================================
function saveOrder(orderData) {
    let orders = JSON.parse(localStorage.getItem("orders") || "[]");
    orders.unshift(orderData);
    localStorage.setItem("orders", JSON.stringify(orders));
    updateOrderCountDisplay();
}

function getOrders() {
    return JSON.parse(localStorage.getItem("orders") || "[]");
}

function clearAllOrders() {
    localStorage.removeItem("orders");
    updateOrderCountDisplay();
    showToast("ล้างข้อมูลเรียบร้อย", "success");
}

function updateOrderCountDisplay() {
    const orders = getOrders();
    const countSpan = document.getElementById("orderCount");
    if (countSpan) countSpan.innerText = orders.length;
}

// ============================================
// Submit Order
// ============================================
async function submitOrder() {
    if (cart.length === 0) {
        showToast("⚠️ ไม่มีสินค้าในตะกร้า", "error");
        return;
    }
    
    const name = document.getElementById("custName").value.trim();
    const email = document.getElementById("custEmail").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    
    if (!name || !email || !phone || !address) {
        showToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", "error");
        return;
    }
    
    const items = cart.map(item => ({
        id: item.id,
        name: item.name,
        price: item.price,
        quantity: item.quantity
    }));
    
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const orderId = "ORD" + new Date().getTime();
    const orderDate = new Date().toLocaleString("th-TH");
    
    const orderData = {
        orderId: orderId,
        date: orderDate,
        name: name,
        email: email,
        phone: phone,
        address: address,
        items: items,
        total: total
    };
    
    showLoading();
    
    // ส่งข้อมูลไปยังเซิร์ฟเวอร์
    const formData = new FormData();
    formData.append("name", name);
    formData.append("email", email);
    formData.append("phone", phone);
    formData.append("address", address);
    formData.append("items", JSON.stringify(items));
    formData.append("total", total);
    formData.append("orderId", orderId);
    
    try {
        await fetch(API_URL, { method: "POST", mode: "no-cors", body: formData });
        console.log("Data sent to server");
    } catch (error) {
        console.log("Server send failed:", error);
    }
    
    // บันทึกใน localStorage
    saveOrder(orderData);
    
    hideLoading();
    
    Swal.fire({
        title: "🎉 สั่งซื้อสำเร็จ!",
        html: `เลขที่คำสั่งซื้อ: <strong>${orderId}</strong><br><br>📧 ระบบได้บันทึกข้อมูลของคุณเรียบร้อย<br>🙏 ขอบคุณที่ใช้บริการ`,
        icon: "success",
        confirmButtonText: "ตกลง"
    });
    
    cart = [];
    updateCartUI();
    closeCart();
    document.getElementById("checkoutModal").classList.add("hidden");
    document.getElementById("custName").value = "";
    document.getElementById("custEmail").value = "";
    document.getElementById("custPhone").value = "";
    document.getElementById("custAddress").value = "";
}

// ============================================
// View Orders
// ============================================
function viewOrders() {
    const orders = getOrders();
    if (orders.length === 0) {
        Swal.fire("📋 คำสั่งซื้อ", "ยังไม่มีคำสั่งซื้อ", "info");
        return;
    }
    
    let orderList = orders.map(o => `
        <div class="border-b pb-3 mb-3">
            <div class="font-bold text-rose-500">${o.orderId}</div>
            <div class="text-xs text-gray-500">${o.date}</div>
            <div class="text-sm mt-1">👤 ${o.name}</div>
            <div class="text-sm">📞 ${o.phone}</div>
            <div class="text-sm mt-1">📦 สินค้า: ${o.items.length} รายการ</div>
            <div class="text-rose-500 font-bold mt-1">💰 ${formatPrice(o.total)}</div>
        </div>
    `).join("");
    
    Swal.fire({
        title: "📋 ประวัติคำสั่งซื้อ",
        html: `<div class="max-h-96 overflow-y-auto text-left">${orderList}</div>`,
        confirmButtonText: "ปิด",
        width: "90%"
    });
}

// ============================================
// Clear Orders Confirm
// ============================================
function clearOrdersConfirm() {
    const orders = getOrders();
    if (orders.length === 0) {
        showToast("ไม่มีข้อมูลที่จะลบ", "info");
        return;
    }
    
    Swal.fire({
        title: "⚠️ ยืนยันการล้างข้อมูล",
        text: "คุณต้องการล้างประวัติคำสั่งซื้อทั้งหมดใช่หรือไม่?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "ใช่, ล้างเลย",
        cancelButtonText: "ยกเลิก",
        confirmButtonColor: "#ef4444"
    }).then((result) => {
        if (result.isConfirmed) {
            clearAllOrders();
            Swal.fire("สำเร็จ!", "ล้างข้อมูลเรียบร้อยแล้ว", "success");
        }
    });
}

// ============================================
// Modal Functions
// ============================================
function openCart() { updateCartUI(); document.getElementById("cartSidebar")?.classList.remove("hidden"); }
function closeCart() { document.getElementById("cartSidebar")?.classList.add("hidden"); }
function openAdmin() { document.getElementById("adminModal")?.classList.remove("hidden"); updateOrderCountDisplay(); }
function closeAdmin() { document.getElementById("adminModal")?.classList.add("hidden"); }

// ============================================
// Initialize
// ============================================
document.addEventListener("DOMContentLoaded", () => {
    renderProducts();
    setupCategories();
    updateOrderCountDisplay();
    
    document.getElementById("searchInput")?.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderProducts();
    });
    
    document.getElementById("cartIcon")?.addEventListener("click", openCart);
    document.getElementById("closeCart")?.addEventListener("click", closeCart);
    document.getElementById("cartOverlay")?.addEventListener("click", closeCart);
    
    document.getElementById("checkoutBtn")?.addEventListener("click", () => {
        if (cart.length === 0) {
            showToast("⚠️ ตะกร้าว่างเปล่า", "error");
            return;
        }
        document.getElementById("checkoutModal")?.classList.remove("hidden");
    });
    
    document.getElementById("cancelCheckout")?.addEventListener("click", () => {
        document.getElementById("checkoutModal")?.classList.add("hidden");
    });
    document.getElementById("checkoutOverlay")?.addEventListener("click", () => {
        document.getElementById("checkoutModal")?.classList.add("hidden");
    });
    document.getElementById("confirmOrder")?.addEventListener("click", submitOrder);
    
    document.getElementById("adminBtn")?.addEventListener("click", openAdmin);
    document.getElementById("closeAdmin")?.addEventListener("click", closeAdmin);
    document.getElementById("adminOverlay")?.addEventListener("click", closeAdmin);
    document.getElementById("viewOrdersBtn")?.addEventListener("click", viewOrders);
    document.getElementById("clearOrdersBtn")?.addEventListener("click", clearOrdersConfirm);
    
    document.getElementById("fabButton")?.addEventListener("click", () => {
        Swal.fire("ยินดีต้อนรับ", "เลือกสินค้าที่คุณชอบแล้วกดหยิบใส่ตะกร้าได้เลย", "info");
    });
    
    document.querySelectorAll(".dock-item").forEach(item => {
        item.addEventListener("click", () => {
            const tab = item.dataset.tab;
            document.querySelectorAll(".dock-item").forEach(d => {
                d.classList.remove("active", "text-rose-500");
                d.classList.add("text-gray-500");
            });
            item.classList.add("active", "text-rose-500");
            
            if (tab === "home") closeCart();
            else if (tab === "cart") openCart();
            else if (tab === "profile") viewOrders();
        });
    });
});
</script>
</body>
</html>
