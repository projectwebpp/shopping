<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>E-Shop Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; padding-bottom: 70px; }
        .product-card { transition: transform 0.2s; cursor: pointer; }
        .product-card:active { transform: scale(0.98); }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .dock-item { cursor: pointer; }
        .dock-item.active { color: #f43f5e; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .cat-btn { cursor: pointer; transition: all 0.3s; }
    </style>
</head>
<body>

<div id="loading" class="loading hidden">
    <div class="bg-white rounded-2xl p-6 text-center">
        <i class="fas fa-spinner fa-pulse text-3xl text-rose-500"></i>
        <p class="mt-2">กำลังโหลดสินค้า...</p>
    </div>
</div>

<div class="max-w-md mx-auto">
    <div class="bg-white sticky top-0 z-50 shadow-sm px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-rose-500">🛍️ E-Shop</h1>
            <p class="text-xs text-gray-400">Thailand</p>
        </div>
        <div id="cartIcon" class="relative cursor-pointer">
            <i class="fas fa-shopping-cart text-2xl"></i>
            <span id="cartCount" class="cart-badge">0</span>
        </div>
    </div>

    <div class="p-4">
        <div class="bg-white rounded-xl shadow-sm border p-3">
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาสินค้า..." class="w-full outline-none">
        </div>
    </div>

    <div id="categoryFilter" class="px-4 flex gap-2 overflow-x-auto pb-2"></div>

    <div id="productGrid" class="product-grid">
        <div class="col-span-full text-center py-10">กำลังโหลดสินค้า...</div>
    </div>
</div>

<!-- Cart Sidebar -->
<div id="cartSidebar" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="cartOverlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-xl flex flex-col">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="font-semibold">🛒 ตะกร้าสินค้า</h2>
            <button id="closeCart" class="text-gray-500"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-auto p-3"></div>
        <div class="p-4 border-t">
            <div class="flex justify-between mb-3">
                <span>💰 รวมทั้งสิ้น</span>
                <span id="cartTotal" class="text-xl font-bold text-rose-500">0 บาท</span>
            </div>
            <button id="checkoutBtn" class="w-full bg-rose-500 text-white py-3 rounded-xl hover:bg-rose-600 transition">
                🧾 สั่งซื้อเลย
            </button>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="checkoutOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-4 max-h-[90vh] overflow-auto">
        <h2 class="text-lg font-semibold mb-4">📝 ข้อมูลการสั่งซื้อ</h2>
        <div class="space-y-3">
            <input type="text" id="custName" placeholder="👤 ชื่อ-นามสกุล" class="w-full border rounded-xl p-3">
            <input type="email" id="custEmail" placeholder="📧 อีเมล" class="w-full border rounded-xl p-3">
            <input type="tel" id="custPhone" placeholder="📱 เบอร์โทร" class="w-full border rounded-xl p-3">
            <textarea id="custAddress" placeholder="🏠 ที่อยู่จัดส่ง" class="w-full border rounded-xl p-3" rows="3"></textarea>
            <div class="flex gap-3">
                <button id="cancelCheckout" class="flex-1 border py-3 rounded-xl">ยกเลิก</button>
                <button id="confirmOrder" class="flex-1 bg-rose-500 text-white py-3 rounded-xl">✅ ยืนยัน</button>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2">
    <div class="dock-item text-center flex-1 py-1 active text-rose-500" data-tab="home">
        <i class="fas fa-home text-xl"></i>
        <div class="text-xs">หน้าแรก</div>
    </div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="cart">
        <i class="fas fa-shopping-cart text-xl"></i>
        <div class="text-xs">ตะกร้า</div>
    </div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="profile">
        <i class="fas fa-user text-xl"></i>
        <div class="text-xs">โปรไฟล์</div>
    </div>
</div>

<script>
// ใช้ google.script.run สำหรับเรียก backend ใน Google Apps Script
let products = [], cart = [], currentCategory = "all", searchQuery = "";

function showLoading() { 
    document.getElementById("loading").classList.remove("hidden"); 
}

function hideLoading() { 
    document.getElementById("loading").classList.add("hidden"); 
}

function formatPrice(p) { 
    return p.toLocaleString() + " บาท"; 
}

function showToast(title, icon = "success") {
    Swal.fire({ 
        title, 
        icon, 
        toast: true, 
        position: "top-end", 
        showConfirmButton: false, 
        timer: 1500 
    });
}

// โหลดสินค้าโดยใช้ google.script.run
function loadProducts() {
    showLoading();
    console.log("📡 กำลังโหลดสินค้า...");
    
    google.script.run
        .withSuccessHandler(function(data) {
            console.log("✅ โหลดสินค้าสำเร็จ:", data);
            if (data.success) {
                products = data.products;
                console.log("📦 สินค้าทั้งหมด:", products.length, "รายการ");
                renderProducts();
                setupCategories();
            } else {
                showToast("❌ " + data.error, "error");
                document.getElementById("productGrid").innerHTML = `<div class="col-span-full text-center py-10 text-red-500">❌ ${data.error}</div>`;
            }
            hideLoading();
        })
        .withFailureHandler(function(error) {
            console.error("❌ โหลดสินค้าล้มเหลว:", error);
            showToast("❌ โหลดสินค้าไม่สำเร็จ: " + error.message, "error");
            document.getElementById("productGrid").innerHTML = `<div class="col-span-full text-center py-10 text-red-500">❌ โหลดสินค้าไม่สำเร็จ<br>${error.message}</div>`;
            hideLoading();
        })
        .getProductsAPI();
}

function renderProducts() {
    let filtered = products.filter(p => currentCategory === "all" || p.category === currentCategory);
    if (searchQuery.trim()) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
    }
    const grid = document.getElementById("productGrid");
    if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">🔍 ไม่พบสินค้า</div>`;
        return;
    }
    grid.innerHTML = filtered.map(p => `
        <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm border">
            <img src="${p.image}" class="w-full h-32 object-cover" onerror="this.src='https://picsum.photos/id/20/200/200'">
            <div class="p-2">
                <div class="text-xs text-gray-400">🏷️ ${p.category}</div>
                <div class="font-medium text-sm">${p.name}</div>
                <div class="text-rose-500 font-bold text-sm">${formatPrice(p.price)}</div>
                <button onclick='addToCart(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="w-full mt-2 bg-rose-500 text-white py-1.5 rounded-lg text-sm hover:bg-rose-600 transition">
                    🛒 หยิบใส่ตะกร้า
                </button>
            </div>
        </div>
    `).join("");
}

function setupCategories() {
    if (!products.length) return;
    const cats = ["all", ...new Set(products.map(p => p.category))];
    const container = document.getElementById("categoryFilter");
    container.innerHTML = cats.map(cat => `
        <button data-cat="${cat}" class="cat-btn px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition ${cat === currentCategory ? "bg-rose-500 text-white" : "bg-gray-200 text-gray-700 hover:bg-gray-300"}">
            ${cat === "all" ? "✨ ทั้งหมด" : cat}
        </button>
    `).join("");
    document.querySelectorAll("[data-cat]").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll("[data-cat]").forEach(b => {
                b.classList.remove("bg-rose-500", "text-white");
                b.classList.add("bg-gray-200", "text-gray-700");
            });
            btn.classList.remove("bg-gray-200", "text-gray-700");
            btn.classList.add("bg-rose-500", "text-white");
            currentCategory = btn.dataset.cat;
            renderProducts();
        };
    });
}

function addToCart(p) {
    let exist = cart.find(i => i.id === p.id);
    if (exist) exist.quantity++;
    else cart.push({ ...p, quantity: 1 });
    updateCartUI();
    showToast("✅ " + p.name + " ใส่ตะกร้าแล้ว");
}

function updateCartUI() {
    let count = cart.reduce((s, i) => s + i.quantity, 0);
    document.getElementById("cartCount").innerText = count;
    let total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
    document.getElementById("cartTotal").innerHTML = formatPrice(total);
    let container = document.getElementById("cartItems");
    if (!cart.length) { 
        container.innerHTML = `<div class="text-center text-gray-400 py-10">🛒 ตะกร้าว่างเปล่า</div>`; 
        return; 
    }
    container.innerHTML = cart.map(i => `
        <div class="flex gap-3 bg-gray-50 rounded-xl p-3 mb-2">
            <img src="${i.image}" class="w-16 h-16 rounded object-cover">
            <div class="flex-1">
                <div class="font-medium text-sm">${i.name}</div>
                <div class="text-rose-500 text-sm">${formatPrice(i.price)}</div>
                <div class="flex gap-2 mt-2 items-center">
                    <button class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 transition" onclick="updateQty('${i.id}', -1)">-</button>
                    <span class="w-8 text-center font-medium">${i.quantity}</span>
                    <button class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 transition" onclick="updateQty('${i.id}', 1)">+</button>
                    <button class="ml-auto text-red-500 hover:text-red-700 transition" onclick="removeFromCart('${i.id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    `).join("");
}

function updateQty(id, d) { 
    let i = cart.find(i => i.id === id); 
    if (i) { 
        i.quantity += d; 
        if (i.quantity <= 0) removeFromCart(id); 
        else updateCartUI(); 
    } 
}

function removeFromCart(id) { 
    cart = cart.filter(i => i.id !== id); 
    updateCartUI(); 
    showToast("🗑️ ลบสินค้าเรียบร้อย", "info"); 
}

// บันทึกคำสั่งซื้อโดยใช้ google.script.run
function submitOrder() {
    if (!cart.length) { 
        showToast("⚠️ ไม่มีสินค้าในตะกร้า", "error"); 
        return; 
    }
    
    let name = document.getElementById("custName").value.trim();
    let email = document.getElementById("custEmail").value.trim();
    let phone = document.getElementById("custPhone").value.trim();
    let address = document.getElementById("custAddress").value.trim();
    
    if (!name || !email || !phone || !address) { 
        showToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", "error"); 
        return; 
    }
    
    // ตรวจสอบอีเมล
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        showToast("⚠️ กรุณากรอกอีเมลให้ถูกต้อง", "error");
        return;
    }
    
    let items = cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity }));
    let total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
    
    let orderData = { 
        name: name, 
        email: email, 
        phone: phone, 
        address: address, 
        items: items, 
        total: total 
    };
    
    console.log("📦 กำลังส่งคำสั่งซื้อ:", orderData);
    showLoading();
    
    google.script.run
        .withSuccessHandler(function(result) {
            console.log("✅ ผลลัพธ์การสั่งซื้อ:", result);
            hideLoading();
            if (result.success) {
                Swal.fire({ 
                    title: "🎉 สั่งซื้อสำเร็จ!", 
                    html: `เลขที่คำสั่งซื้อ: <strong>${result.orderId}</strong><br><br>🙏 ขอบคุณที่ใช้บริการ`, 
                    icon: "success",
                    confirmButtonColor: "#f43f5e"
                });
                cart = [];
                updateCartUI();
                closeCart();
                document.getElementById("checkoutModal").classList.add("hidden");
                ["custName", "custEmail", "custPhone", "custAddress"].forEach(id => document.getElementById(id).value = "");
            } else {
                Swal.fire("❌ ผิดพลาด", result.error || "ไม่สามารถบันทึกคำสั่งซื้อได้", "error");
            }
        })
        .withFailureHandler(function(error) {
            console.error("❌ การสั่งซื้อล้มเหลว:", error);
            hideLoading();
            Swal.fire("❌ ผิดพลาด", "ไม่สามารถบันทึกคำสั่งซื้อได้: " + error.message, "error");
        })
        .handlePost(orderData);
}

function openCart() { 
    updateCartUI(); 
    document.getElementById("cartSidebar").classList.remove("hidden"); 
}

function closeCart() { 
    document.getElementById("cartSidebar").classList.add("hidden"); 
}

// เมื่อหน้าเว็บโหลดเสร็จ
document.addEventListener("DOMContentLoaded", () => {
    console.log("🚀 หน้าเว็บโหลดเสร็จ กำลังเริ่มต้นระบบ...");
    loadProducts();
    
    document.getElementById("searchInput").oninput = e => { 
        searchQuery = e.target.value; 
        renderProducts(); 
    };
    
    document.getElementById("cartIcon").onclick = openCart;
    document.getElementById("closeCart").onclick = closeCart;
    document.getElementById("cartOverlay").onclick = closeCart;
    
    document.getElementById("checkoutBtn").onclick = () => {
        if (cart.length) {
            document.getElementById("checkoutModal").classList.remove("hidden");
        } else {
            showToast("⚠️ ตะกร้าว่างเปล่า", "error");
        }
    };
    
    document.getElementById("cancelCheckout").onclick = () => {
        document.getElementById("checkoutModal").classList.add("hidden");
    };
    
    document.getElementById("checkoutOverlay").onclick = () => {
        document.getElementById("checkoutModal").classList.add("hidden");
    };
    
    document.getElementById("confirmOrder").onclick = submitOrder;
    
    document.querySelectorAll(".dock-item").forEach(item => {
        item.onclick = () => {
            document.querySelectorAll(".dock-item").forEach(d => {
                d.classList.remove("active", "text-rose-500");
                d.classList.add("text-gray-500");
            });
            item.classList.add("active", "text-rose-500");
            item.classList.remove("text-gray-500");
            
            if (item.dataset.tab === "cart") openCart();
            else if (item.dataset.tab === "home") closeCart();
            else if (item.dataset.tab === "profile") {
                Swal.fire("👤 โปรไฟล์", "ยินดีต้อนรับสู่ E-Shop Thailand\n\nติดต่อ: support@eshopthailand.com", "info");
            }
        };
    });
});

// ป้องกันการคลิกปุ่มซ้ำ
let isSubmitting = false;
function submitOrderWithLock() {
    if (isSubmitting) return;
    isSubmitting = true;
    submitOrder();
    setTimeout(() => { isSubmitting = false; }, 3000);
}

// แก้ไข event listener
document.addEventListener("DOMContentLoaded", () => {
    const confirmBtn = document.getElementById("confirmOrder");
    if (confirmBtn) {
        confirmBtn.onclick = submitOrderWithLock;
    }
});
</script>
</body>
</html>
