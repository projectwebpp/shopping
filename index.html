<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>E-Shop Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; padding-bottom: 70px; }
        .product-card { transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .dock-item { cursor: pointer; }
        .dock-item.active { color: #f43f5e; }
        .quantity-btn { width: 32px; height: 32px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loading" class="loading hidden">
    <div class="bg-white rounded-2xl p-6"><i class="fas fa-spinner fa-pulse text-3xl text-rose-500"></i><p class="mt-2">กำลังดำเนินการ...</p></div>
</div>

<div class="max-w-md mx-auto">
    <!-- Header -->
    <div class="bg-white sticky top-0 z-50 shadow-sm px-4 py-3 flex justify-between items-center">
        <div><h1 class="text-xl font-bold text-rose-500">🛍️ E-Shop</h1><p class="text-xs text-gray-400">Thailand</p></div>
        <div class="relative cursor-pointer" id="cartIcon"><i class="fas fa-shopping-cart text-2xl"></i><span id="cartCount" class="cart-badge">0</span></div>
    </div>

    <!-- Search -->
    <div class="p-4"><div class="bg-white rounded-xl shadow-sm p-3 flex gap-2"><i class="fas fa-search text-gray-400"></i><input type="text" id="searchInput" placeholder="ค้นหาสินค้า..." class="flex-1 outline-none"></div></div>

    <!-- Categories -->
    <div id="categoryFilter" class="px-4 flex gap-2 overflow-x-auto pb-2"></div>

    <!-- Products -->
    <div id="productGrid" class="product-grid"></div>
</div>

<!-- Cart Sidebar -->
<div id="cartSidebar" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="cartOverlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-xl flex flex-col">
        <div class="p-4 border-b flex justify-between"><h2 class="font-semibold">🛒 ตะกร้าสินค้า</h2><button id="closeCart"><i class="fas fa-times"></i></button></div>
        <div id="cartItems" class="flex-1 overflow-auto p-3"></div>
        <div class="p-4 border-t"><div class="flex justify-between mb-3"><span>รวมทั้งสิ้น</span><span id="cartTotal" class="text-xl font-bold text-rose-500">0 บาท</span></div><button id="checkoutBtn" class="w-full bg-rose-500 text-white py-3 rounded-xl">สั่งซื้อเลย</button></div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="checkoutOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-4">
        <h2 class="text-lg font-semibold mb-4">ข้อมูลการสั่งซื้อ</h2>
        <div class="space-y-3">
            <input type="text" id="custName" placeholder="ชื่อ-นามสกุล" class="w-full border rounded-xl p-3">
            <input type="email" id="custEmail" placeholder="อีเมล" class="w-full border rounded-xl p-3">
            <input type="tel" id="custPhone" placeholder="เบอร์โทร" class="w-full border rounded-xl p-3">
            <textarea id="custAddress" placeholder="ที่อยู่จัดส่ง" class="w-full border rounded-xl p-3" rows="3"></textarea>
            <div class="flex gap-3"><button id="cancelCheckout" class="flex-1 border py-3 rounded-xl">ยกเลิก</button><button id="confirmOrder" class="flex-1 bg-rose-500 text-white py-3 rounded-xl">ยืนยัน</button></div>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2">
    <div class="dock-item text-center flex-1 py-1 active text-rose-500" data-tab="home"><i class="fas fa-home text-xl"></i><div class="text-xs">หน้าแรก</div></div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="cart"><i class="fas fa-shopping-cart text-xl"></i><div class="text-xs">ตะกร้า</div></div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="profile"><i class="fas fa-user text-xl"></i><div class="text-xs">โปรไฟล์</div></div>
</div>

<script>
let products = [];
let cart = [];
let currentCategory = "all";
let searchQuery = "";

function showLoading() { document.getElementById("loading").classList.remove("hidden"); }
function hideLoading() { document.getElementById("loading").classList.add("hidden"); }
function formatPrice(p) { return p.toLocaleString() + " บาท"; }

// โหลดสินค้า
function loadProducts() {
    showLoading();
    google.script.run.withSuccessHandler(function(result) {
        products = result;
        renderProducts();
        setupCategories();
        hideLoading();
    }).withFailureHandler(function() {
        products = [
            { id: "P001", name: "เสื้อเชิ้ตผู้ชายคอปก", price: 399, image: "https://picsum.photos/id/20/200/200", category: "เสื้อผ้า" },
            { id: "P002", name: "กางเกงยีนส์สลิมฟิต", price: 599, image: "https://picsum.photos/id/26/200/200", category: "เสื้อผ้า" },
            { id: "P003", name: "รองเท้าผ้าใบสไตล์วินเทจ", price: 899, image: "https://picsum.photos/id/0/200/200", category: "รองเท้า" },
            { id: "P004", name: "หมวกแก๊ปผู้ชาย", price: 199, image: "https://picsum.photos/id/1/200/200", category: "เครื่องประดับ" },
            { id: "P005", name: "กระเป๋าเป้สะพายหลัง", price: 1290, image: "https://picsum.photos/id/133/200/200", category: "กระเป๋า" },
            { id: "P006", name: "นาฬิกาข้อมือสปอร์ต", price: 2490, image: "https://picsum.photos/id/82/200/200", category: "เครื่องประดับ" },
            { id: "P007", name: "เสื้อฮู้ดผ้าฝ้าย", price: 459, image: "https://picsum.photos/id/24/200/200", category: "เสื้อผ้า" },
            { id: "P008", name: "แก้วน้ำสแตนเลส", price: 299, image: "https://picsum.photos/id/30/200/200", category: "ของใช้" }
        ];
        renderProducts();
        setupCategories();
        hideLoading();
    }).getProducts();
}

function renderProducts() {
    let filtered = products.filter(p => currentCategory === "all" || p.category === currentCategory);
    if (searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
    const grid = document.getElementById("productGrid");
    if (filtered.length === 0) { grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">ไม่พบสินค้า</div>`; return; }
    grid.innerHTML = filtered.map(p => `
        <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm">
            <img src="${p.image}" class="w-full h-32 object-cover">
            <div class="p-2">
                <div class="text-xs text-gray-400">${p.category}</div>
                <div class="font-medium text-sm">${p.name}</div>
                <div class="text-rose-500 font-bold">${formatPrice(p.price)}</div>
                <button onclick='addToCart(${JSON.stringify(p)})' class="w-full mt-2 bg-rose-500 text-white py-1.5 rounded-lg text-sm">🛒 หยิบใส่ตะกร้า</button>
            </div>
        </div>
    `).join("");
}

function setupCategories() {
    const cats = ["all", ...new Set(products.map(p => p.category))];
    const container = document.getElementById("categoryFilter");
    container.innerHTML = cats.map(cat => `<button data-cat="${cat}" class="cat-btn px-4 py-1.5 rounded-full text-sm ${cat === "all" ? "bg-rose-500 text-white" : "bg-gray-200"}">${cat === "all" ? "ทั้งหมด" : cat}</button>`).join("");
    document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".cat-btn").forEach(b => { b.classList.remove("bg-rose-500", "text-white"); b.classList.add("bg-gray-200"); });
            btn.classList.add("bg-rose-500", "text-white");
            currentCategory = btn.dataset.cat;
            renderProducts();
        };
    });
}

function addToCart(p) {
    let exist = cart.find(i => i.id === p.id);
    if (exist) exist.qty++;
    else cart.push({ ...p, qty: 1 });
    updateCartUI();
    Swal.fire({ title: "ใส่ตะกร้าแล้ว", icon: "success", toast: true, timer: 1500, showConfirmButton: false, position: "top-end" });
}

function removeFromCart(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); }
function updateQty(id, delta) { let i = cart.find(i => i.id === id); if (i) { i.qty += delta; if (i.qty <= 0) removeFromCart(id); else updateCartUI(); } }

function updateCartUI() {
    let count = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById("cartCount").innerText = count;
    let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    document.getElementById("cartTotal").innerHTML = formatPrice(total);
    let container = document.getElementById("cartItems");
    if (cart.length === 0) { container.innerHTML = `<div class="text-center text-gray-400 py-10">ตะกร้าว่างเปล่า</div>`; return; }
    container.innerHTML = cart.map(i => `
        <div class="flex gap-3 bg-gray-50 rounded-xl p-3">
            <img src="${i.image}" class="w-16 h-16 rounded object-cover">
            <div class="flex-1">
                <div class="font-medium">${i.name}</div>
                <div class="text-rose-500">${formatPrice(i.price)}</div>
                <div class="flex gap-2 mt-2">
                    <button class="quantity-btn" onclick="updateQty('${i.id}', -1)"><i class="fas fa-minus"></i></button>
                    <span class="w-8 text-center">${i.qty}</span>
                    <button class="quantity-btn" onclick="updateQty('${i.id}', 1)"><i class="fas fa-plus"></i></button>
                    <button class="ml-auto text-red-500" onclick="removeFromCart('${i.id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    `).join("");
}

function submitOrder() {
    if (cart.length === 0) { Swal.fire("ผิดพลาด", "ไม่มีสินค้าในตะกร้า", "error"); return; }
    let name = document.getElementById("custName").value.trim();
    let email = document.getElementById("custEmail").value.trim();
    let phone = document.getElementById("custPhone").value.trim();
    let address = document.getElementById("custAddress").value.trim();
    if (!name || !email || !phone || !address) { Swal.fire("ผิดพลาด", "กรุณากรอกข้อมูลให้ครบ", "error"); return; }
    
    let items = cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.qty }));
    let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    
    showLoading();
    google.script.run.withSuccessHandler(function(result) {
        hideLoading();
        if (result.success) {
            Swal.fire({ title: "สั่งซื้อสำเร็จ!", text: "ขอบคุณที่ใช้บริการ", icon: "success" });
            cart = [];
            updateCartUI();
            document.getElementById("checkoutModal").classList.add("hidden");
            document.getElementById("custName").value = "";
            document.getElementById("custEmail").value = "";
            document.getElementById("custPhone").value = "";
            document.getElementById("custAddress").value = "";
        } else {
            Swal.fire("ผิดพลาด", result.error || "ไม่สามารถบันทึกได้", "error");
        }
    }).withFailureHandler(function(err) {
        hideLoading();
        Swal.fire("ผิดพลาด", "ไม่สามารถเชื่อมต่อได้", "error");
    }).doPost({ postData: { contents: JSON.stringify({ name, email, phone, address, items, total }) } });
}

function openCart() { updateCartUI(); document.getElementById("cartSidebar").classList.remove("hidden"); }
function closeCart() { document.getElementById("cartSidebar").classList.add("hidden"); }

document.addEventListener("DOMContentLoaded", () => {
    loadProducts();
    document.getElementById("searchInput").oninput = (e) => { searchQuery = e.target.value; renderProducts(); };
    document.getElementById("cartIcon").onclick = openCart;
    document.getElementById("closeCart").onclick = closeCart;
    document.getElementById("cartOverlay").onclick = closeCart;
    document.getElementById("checkoutBtn").onclick = () => { if (cart.length > 0) document.getElementById("checkoutModal").classList.remove("hidden"); else Swal.fire("ตะกร้าว่าง", "กรุณาเลือกสินค้าก่อน", "error"); };
    document.getElementById("cancelCheckout").onclick = () => document.getElementById("checkoutModal").classList.add("hidden");
    document.getElementById("checkoutOverlay").onclick = () => document.getElementById("checkoutModal").classList.add("hidden");
    document.getElementById("confirmOrder").onclick = submitOrder;
    document.querySelectorAll(".dock-item").forEach(item => {
        item.onclick = () => {
            document.querySelectorAll(".dock-item").forEach(d => d.classList.remove("active", "text-rose-500"));
            item.classList.add("active", "text-rose-500");
            if (item.dataset.tab === "cart") openCart();
            else if (item.dataset.tab === "home") closeCart();
            else if (item.dataset.tab === "profile") Swal.fire("โปรไฟล์", "ยินดีต้อนรับสู่ E-Shop", "info");
        };
    });
});
</script>
</body>
</html>
