<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>E-Shop Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; padding-bottom: 70px; }
        .product-card { transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .dock-item { cursor: pointer; transition: all 0.2s; }
        .dock-item.active { color: #f43f5e; }
        .quantity-btn { width: 32px; height: 32px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .cat-btn { cursor: pointer; }
        .admin-btn { cursor: pointer; }
        .cart-item { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="bg-white rounded-2xl p-6 flex flex-col items-center">
        <i class="fas fa-spinner fa-pulse text-3xl text-rose-500"></i>
        <p class="mt-2">กำลังดำเนินการ...</p>
    </div>
</div>

<div class="max-w-md mx-auto">
    <div class="bg-white sticky top-0 z-50 shadow-sm px-4 py-3 flex justify-between items-center">
        <div><h1 class="text-xl font-bold text-rose-500">🛍️ E-Shop</h1><p class="text-xs text-gray-400">Thailand</p></div>
        <div class="flex items-center gap-3">
            <div id="adminBtn" class="admin-btn text-gray-500"><i class="fas fa-cog text-xl"></i></div>
            <div id="cartIcon" class="relative cursor-pointer"><i class="fas fa-shopping-cart text-2xl text-gray-700"></i><span id="cartCount" class="cart-badge">0</span></div>
        </div>
    </div>

    <div class="p-4"><div class="bg-white rounded-xl shadow-sm border p-3 flex gap-2"><i class="fas fa-search text-gray-400"></i><input type="text" id="searchInput" placeholder="ค้นหาสินค้า..." class="flex-1 outline-none text-sm"></div></div>

    <div id="categoryFilter" class="px-4 flex gap-2 overflow-x-auto whitespace-nowrap pb-2 hide-scrollbar"></div>

    <div id="productGrid" class="product-grid"><div class="col-span-full text-center text-gray-400 py-10"><i class="fas fa-spinner fa-pulse text-2xl"></i><p class="mt-2">กำลังโหลดสินค้า...</p></div></div>
</div>

<!-- Cart Sidebar -->
<div id="cartSidebar" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="cartOverlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-sm bg-white shadow-2xl flex flex-col">
        <div class="p-4 border-b flex justify-between items-center"><h2 class="text-lg font-semibold"><i class="fas fa-shopping-cart text-rose-500 mr-2"></i>ตะกร้าสินค้า</h2><button id="closeCart" class="text-gray-500"><i class="fas fa-times text-xl"></i></button></div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"><div class="text-center text-gray-400 py-10"><i class="fas fa-shopping-cart text-4xl mb-3"></i><p>ตะกร้าว่างเปล่า</p></div></div>
        <div class="p-4 border-t bg-white"><div class="flex justify-between mb-3"><span class="font-semibold">รวมทั้งสิ้น</span><span id="cartTotal" class="text-xl font-bold text-rose-500">0 บาท</span></div><button id="checkoutBtn" class="w-full bg-rose-500 text-white py-3 rounded-xl font-semibold">🧾 สั่งซื้อเลย</button></div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="checkoutOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl max-h-[80vh] overflow-y-auto">
        <div class="p-4 border-b"><h2 class="text-lg font-semibold">📝 ข้อมูลการสั่งซื้อ</h2></div>
        <div class="p-4 space-y-4">
            <input type="text" id="custName" placeholder="ชื่อ-นามสกุล" class="w-full border rounded-xl p-3">
            <input type="email" id="custEmail" placeholder="อีเมล" class="w-full border rounded-xl p-3">
            <input type="tel" id="custPhone" placeholder="เบอร์โทรศัพท์" class="w-full border rounded-xl p-3">
            <textarea id="custAddress" placeholder="ที่อยู่จัดส่ง" class="w-full border rounded-xl p-3" rows="3"></textarea>
            <div class="flex gap-3"><button id="cancelCheckout" class="flex-1 border py-3 rounded-xl">ยกเลิก</button><button id="confirmOrder" class="flex-1 bg-rose-500 text-white py-3 rounded-xl">✅ ยืนยัน</button></div>
        </div>
    </div>
</div>

<!-- Admin Modal -->
<div id="adminModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" id="adminOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl">
        <div class="p-4 border-b flex justify-between"><h2 class="text-lg font-semibold"><i class="fas fa-database text-rose-500 mr-2"></i>จัดการฐานข้อมูล</h2><button id="closeAdmin" class="text-gray-500"><i class="fas fa-times"></i></button></div>
        <div class="p-4 space-y-4">
            <div id="dbStatus" class="bg-gray-50 rounded-xl p-3 text-sm"><span>📋 สถานะ:</span> <span id="statusText">กำลังโหลด...</span></div>
            <div class="grid grid-cols-2 gap-3">
                <button id="setupDbBtn" class="bg-green-500 text-white py-3 rounded-xl font-semibold"><i class="fas fa-plus-circle mr-2"></i>สร้างฐานข้อมูล</button>
                <button id="refreshBtn" class="bg-blue-500 text-white py-3 rounded-xl font-semibold"><i class="fas fa-sync-alt mr-2"></i>โหลดสินค้าใหม่</button>
            </div>
        </div>
    </div>
</div>

<div class="fixed bottom-20 right-4 z-40"><button id="fabButton" class="w-14 h-14 bg-rose-500 rounded-full shadow-lg text-white flex items-center justify-center"><i class="fas fa-plus text-2xl"></i></button></div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-40">
    <div class="dock-item text-center flex-1 py-1 active text-rose-500" data-tab="home"><i class="fas fa-home text-xl"></i><div class="text-xs">หน้าแรก</div></div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="cart"><i class="fas fa-shopping-cart text-xl"></i><div class="text-xs">ตะกร้า</div></div>
    <div class="dock-item text-center flex-1 py-1 text-gray-500" data-tab="profile"><i class="fas fa-user text-xl"></i><div class="text-xs">โปรไฟล์</div></div>
</div>

<script>
let products = [];
let cart = [];
let currentCategory = "all";
let searchQuery = "";

function showLoading() { document.getElementById("loadingOverlay")?.classList.remove("hidden"); }
function hideLoading() { document.getElementById("loadingOverlay")?.classList.add("hidden"); }
function formatPrice(p) { return p.toLocaleString("th-TH") + " บาท"; }
function showToast(title, icon = "success") { Swal.fire({ title, icon, toast: true, position: "top-end", showConfirmButton: false, timer: 1500 }); }

function loadProducts() {
    showLoading();
    google.script.run.withSuccessHandler(function(result) {
        products = result;
        renderProducts();
        setupCategories();
        hideLoading();
    }).withFailureHandler(function(error) {
        console.error(error);
        products = [
            { id: "P001", name: "เสื้อเชิ้ตผู้ชายคอปก", price: 399, image: "https://picsum.photos/id/20/200/200", category: "เสื้อผ้า" },
            { id: "P002", name: "กางเกงยีนส์สลิมฟิต", price: 599, image: "https://picsum.photos/id/26/200/200", category: "เสื้อผ้า" },
            { id: "P003", name: "รองเท้าผ้าใบสไตล์วินเทจ", price: 899, image: "https://picsum.photos/id/0/200/200", category: "รองเท้า" },
            { id: "P004", name: "หมวกแก๊ปผู้ชาย", price: 199, image: "https://picsum.photos/id/1/200/200", category: "เครื่องประดับ" },
            { id: "P005", name: "กระเป๋าเป้สะพายหลัง", price: 1290, image: "https://picsum.photos/id/133/200/200", category: "กระเป๋า" },
            { id: "P006", name: "นาฬิกาข้อมือสปอร์ต", price: 2490, image: "https://picsum.photos/id/82/200/200", category: "เครื่องประดับ" },
            { id: "P007", name: "เสื้อฮู้ดผ้าฝ้าย", price: 459, image: "https://picsum.photos/id/24/200/200", category: "เสื้อผ้า" },
            { id: "P008", name: "แก้วน้ำสแตนเลส", price: 299, image: "https://picsum.photos/id/30/200/200", category: "ของใช้" }
        ];
        renderProducts();
        setupCategories();
        hideLoading();
    }).getProducts();
}

function renderProducts() {
    let filtered = products.filter(p => currentCategory === "all" || p.category === currentCategory);
    if (searchQuery.trim()) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
    const grid = document.getElementById("productGrid");
    if (!grid) return;
    if (filtered.length === 0) { grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">🔍 ไม่พบสินค้า</div>`; return; }
    grid.innerHTML = filtered.map(p => `
        <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm border">
            <img src="${p.image}" class="w-full h-32 object-cover">
            <div class="p-2">
                <div class="text-xs text-gray-400">${p.category}</div>
                <div class="font-medium text-sm truncate">${p.name}</div>
                <div class="text-rose-500 font-bold text-sm">${formatPrice(p.price)}</div>
                <button onclick='addToCart(${JSON.stringify(p)})' class="w-full mt-2 bg-rose-500 text-white py-1.5 rounded-lg text-sm"><i class="fas fa-cart-plus mr-1"></i> หยิบใส่ตะกร้า</button>
            </div>
        </div>
    `).join("");
}

function setupCategories() {
    const cats = ["all", ...new Set(products.map(p => p.category))];
    const container = document.getElementById("categoryFilter");
    container.innerHTML = cats.map(cat => `<button data-cat="${cat}" class="cat-btn px-4 py-1.5 rounded-full text-sm ${cat === "all" ? "bg-rose-500 text-white" : "bg-gray-100 text-gray-700"}">${cat === "all" ? "✨ ทั้งหมด" : cat}</button>`).join("");
    document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".cat-btn").forEach(b => { b.classList.remove("bg-rose-500", "text-white"); b.classList.add("bg-gray-100", "text-gray-700"); });
            btn.classList.add("bg-rose-500", "text-white");
            currentCategory = btn.dataset.cat;
            renderProducts();
        };
    });
}

function addToCart(p) {
    let exist = cart.find(i => i.id === p.id);
    if (exist) exist.quantity++;
    else cart.push({ ...p, quantity: 1 });
    updateCartUI();
    showToast("✅ " + p.name + " ใส่ตะกร้าแล้ว");
}

function removeFromCart(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); showToast("🗑️ ลบสินค้า"); }
function updateQty(id, delta) { let i = cart.find(i => i.id === id); if (i) { i.quantity += delta; if (i.quantity <= 0) removeFromCart(id); else updateCartUI(); } }

function updateCartUI() {
    let count = cart.reduce((s, i) => s + i.quantity, 0);
    document.getElementById("cartCount").innerText = count;
    let total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
    document.getElementById("cartTotal").innerHTML = formatPrice(total);
    let container = document.getElementById("cartItems");
    if (cart.length === 0) { container.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fas fa-shopping-cart text-4xl mb-3"></i><p>ตะกร้าว่างเปล่า</p></div>`; return; }
    container.innerHTML = cart.map(i => `
        <div class="cart-item flex gap-3 bg-gray-50 rounded-xl p-3">
            <img src="${i.image}" class="w-16 h-16 rounded object-cover">
            <div class="flex-1">
                <div class="font-medium text-sm">${i.name}</div>
                <div class="text-rose-500 text-sm">${formatPrice(i.price)}</div>
                <div class="flex gap-2 mt-2">
                    <button class="quantity-btn" onclick="updateQty('${i.id}', -1)"><i class="fas fa-minus"></i></button>
                    <span class="w-8 text-center">${i.quantity}</span>
                    <button class="quantity-btn" onclick="updateQty('${i.id}', 1)"><i class="fas fa-plus"></i></button>
                    <button class="ml-auto text-red-500" onclick="removeFromCart('${i.id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    `).join("");
}

function submitOrder() {
    if (cart.length === 0) { showToast("⚠️ ไม่มีสินค้าในตะกร้า", "error"); return; }
    let name = document.getElementById("custName").value.trim();
    let email = document.getElementById("custEmail").value.trim();
    let phone = document.getElementById("custPhone").value.trim();
    let address = document.getElementById("custAddress").value.trim();
    if (!name || !email || !phone || !address) { showToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", "error"); return; }
    
    let items = cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity }));
    let total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
    
    showLoading();
    google.script.run.withSuccessHandler(function(result) {
        hideLoading();
        if (result.success) {
            Swal.fire({ title: "🎉 สั่งซื้อสำเร็จ!", html: `เลขที่คำสั่งซื้อ: <strong>${result.orderId}</strong><br><br>ขอบคุณที่ใช้บริการ`, icon: "success" });
            cart = [];
            updateCartUI();
            closeCart();
            document.getElementById("checkoutModal").classList.add("hidden");
            document.getElementById("custName").value = "";
            document.getElementById("custEmail").value = "";
            document.getElementById("custPhone").value = "";
            document.getElementById("custAddress").value = "";
        } else { Swal.fire("❌ ผิดพลาด", result.error, "error"); }
    }).withFailureHandler(function(err) { hideLoading(); Swal.fire("❌ ผิดพลาด", "ไม่สามารถเชื่อมต่อได้", "error"); }).doPost({ postData: { contents: JSON.stringify({ name, email, phone, address, items, total }) } });
}

function loadDatabaseStatus() {
    google.script.run.withSuccessHandler(function(r) {
        if (r.success) document.getElementById("statusText").innerHTML = `📋 Orders: ${r.ordersCount} | 🏷️ Products: ${r.productsCount}`;
        else document.getElementById("statusText").innerHTML = "❌ ไม่พบข้อมูล";
    }).getDatabaseStatus();
}

function setupDatabase() {
    Swal.fire({ title: "ยืนยัน", text: "สร้างฐานข้อมูล (Sheet Orders และ Products)?", icon: "question", showCancelButton: true }).then((res) => {
        if (res.isConfirmed) {
            showLoading();
            google.script.run.withSuccessHandler(function(r) {
                hideLoading();
                if (r.success) { Swal.fire("สำเร็จ!", r.message, "success"); loadDatabaseStatus(); loadProducts(); }
                else { Swal.fire("ผิดพลาด", r.message, "error"); }
            }).setupDatabase();
        }
    });
}

function openCart() { updateCartUI(); document.getElementById("cartSidebar")?.classList.remove("hidden"); }
function closeCart() { document.getElementById("cartSidebar")?.classList.add("hidden"); }
function openAdmin() { document.getElementById("adminModal")?.classList.remove("hidden"); loadDatabaseStatus(); }
function closeAdmin() { document.getElementById("adminModal")?.classList.add("hidden"); }

document.addEventListener("DOMContentLoaded", () => {
    loadProducts();
    document.getElementById("searchInput")?.addEventListener("input", (e) => { searchQuery = e.target.value; renderProducts(); });
    document.getElementById("cartIcon")?.addEventListener("click", openCart);
    document.getElementById("closeCart")?.addEventListener("click", closeCart);
    document.getElementById("cartOverlay")?.addEventListener("click", closeCart);
    document.getElementById("checkoutBtn")?.addEventListener("click", () => { if (cart.length === 0) showToast("⚠️ ตะกร้าว่าง", "error"); else document.getElementById("checkoutModal")?.classList.remove("hidden"); });
    document.getElementById("cancelCheckout")?.addEventListener("click", () => document.getElementById("checkoutModal")?.classList.add("hidden"));
    document.getElementById("checkoutOverlay")?.addEventListener("click", () => document.getElementById("checkoutModal")?.classList.add("hidden"));
    document.getElementById("confirmOrder")?.addEventListener("click", submitOrder);
    document.getElementById("adminBtn")?.addEventListener("click", openAdmin);
    document.getElementById("closeAdmin")?.addEventListener("click", closeAdmin);
    document.getElementById("adminOverlay")?.addEventListener("click", closeAdmin);
    document.getElementById("setupDbBtn")?.addEventListener("click", setupDatabase);
    document.getElementById("refreshBtn")?.addEventListener("click", () => { loadProducts(); loadDatabaseStatus(); });
    document.getElementById("fabButton")?.addEventListener("click", () => Swal.fire("ยินดีต้อนรับ", "เลือกสินค้าที่คุณชอบ", "info"));
    document.querySelectorAll(".dock-item").forEach(item => {
        item.addEventListener("click", () => {
            document.querySelectorAll(".dock-item").forEach(d => { d.classList.remove("active", "text-rose-500"); d.classList.add("text-gray-500"); });
            item.classList.add("active", "text-rose-500");
            if (item.dataset.tab === "home") closeCart();
            else if (item.dataset.tab === "cart") openCart();
            else if (item.dataset.tab === "profile") Swal.fire("โปรไฟล์", "ยินดีต้อนรับสู่ E-Shop Thailand", "info");
        });
    });
});
</script>
</body>
</html>
