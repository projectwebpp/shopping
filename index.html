<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.line-scdn.net/liff/edge/versions/2.21.4/sdk.js"></script>
</head>
<body class="bg-gray-100">

<div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
    <!-- Header -->
    <div class="bg-rose-500 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">E-Shop Thailand</h1>
        <div id="cartIcon" class="relative cursor-pointer">
            <i class="fas fa-shopping-cart text-2xl"></i>
            <span id="cartCount" class="absolute -top-2 -right-2 bg-yellow-400 text-rose-500 rounded-full w-5 h-5 text-xs flex items-center justify-center font-bold">0</span>
        </div>
    </div>

    <!-- Products -->
    <div id="products" class="p-4 grid grid-cols-2 gap-3"></div>
</div>

<!-- Cart Modal -->
<div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl max-h-[80vh] overflow-y-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold"><i class="fas fa-shopping-cart text-rose-500 mr-2"></i>ตะกร้าสินค้า</h2>
            <button id="closeCart" class="text-gray-500"><i class="fas fa-times text-2xl"></i></button>
        </div>
        <div id="cartItems" class="space-y-3"></div>
        <div class="border-t pt-4 mt-4">
            <div class="flex justify-between mb-3">
                <span class="font-bold">รวมทั้งสิ้น</span>
                <span id="cartTotal" class="text-xl font-bold text-rose-500">0 บาท</span>
            </div>
            <button id="checkoutBtn" class="w-full bg-rose-500 text-white py-3 rounded-xl font-bold">สั่งซื้อเลย</button>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-4">
        <h2 class="text-xl font-bold mb-4">ข้อมูลการสั่งซื้อ</h2>
        <input type="text" id="name" placeholder="ชื่อ-นามสกุล" class="w-full border rounded-lg p-3 mb-3">
        <input type="email" id="email" placeholder="อีเมล" class="w-full border rounded-lg p-3 mb-3">
        <input type="tel" id="phone" placeholder="เบอร์โทร" class="w-full border rounded-lg p-3 mb-3">
        <textarea id="address" placeholder="ที่อยู่" class="w-full border rounded-lg p-3 mb-3" rows="3"></textarea>
        <div class="flex gap-3">
            <button id="cancelCheckout" class="flex-1 border py-3 rounded-lg">ยกเลิก</button>
            <button id="confirmOrder" class="flex-1 bg-rose-500 text-white py-3 rounded-lg">ยืนยัน</button>
        </div>
    </div>
</div>

<script>
// ตั้งค่า
const API_URL = "https://script.google.com/macros/s/AKfycbz-Eeftf2a057_Nu7kNivs41eAHH0EqvGzs4Z3spO3jS3QiuGUjyKMaafxF0DUarLb9/exec";
const LIFF_ID = "2006974084-pCKlrYsc";

let products = [];
let cart = [];
let user = null;
let orders = [];

// แสดง loading
function showLoading() { Swal.fire({ title: 'กำลังโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() }); }
function hideLoading() { Swal.close(); }

// จัดการราคา
function formatPrice(p) { return p.toLocaleString() + " บาท"; }

// ดึงสินค้า
async function loadProducts() {
    showLoading();
    try {
        const res = await fetch(API_URL + "?action=getProducts");
        const data = await res.json();
        if (data.success) products = data.products;
        renderProducts();
    } catch(e) { console.error(e); }
    hideLoading();
}

// แสดงสินค้า
function renderProducts() {
    const container = document.getElementById("products");
    if (!products.length) { container.innerHTML = '<div class="col-span-full text-center py-10">ไม่มีสินค้า</div>'; return; }
    container.innerHTML = products.map(p => `
        <div class="border rounded-xl p-3 shadow-sm">
            <img src="${p.image}" class="w-full h-32 object-cover rounded-lg mb-2">
            <div class="text-sm text-gray-500">${p.category}</div>
            <div class="font-bold">${p.name}</div>
            <div class="text-rose-500 font-bold">${formatPrice(p.price)}</div>
            <button onclick='addToCart(${JSON.stringify(p)})' class="w-full mt-2 bg-rose-500 text-white py-2 rounded-lg text-sm">+ หยิบใส่ตะกร้า</button>
        </div>
    `).join("");
}

// จัดการตะกร้า
function addToCart(p) {
    let exist = cart.find(i => i.id === p.id);
    if (exist) exist.qty++;
    else cart.push({ ...p, qty: 1 });
    updateCartUI();
    Swal.fire({ title: "เพิ่มสินค้า", text: p.name, icon: "success", toast: true, timer: 1500, showConfirmButton: false });
}

function updateCartUI() {
    let count = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById("cartCount").innerText = count;
    let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    document.getElementById("cartTotal").innerHTML = formatPrice(total);
    let container = document.getElementById("cartItems");
    if (!cart.length) { container.innerHTML = '<div class="text-center py-10 text-gray-400">ตะกร้าว่างเปล่า</div>'; return; }
    container.innerHTML = cart.map(i => `
        <div class="flex gap-3 border-b pb-3">
            <img src="${i.image}" class="w-16 h-16 object-cover rounded">
            <div class="flex-1">
                <div class="font-bold">${i.name}</div>
                <div class="text-rose-500">${formatPrice(i.price)}</div>
                <div class="flex items-center gap-2 mt-1">
                    <button onclick="updateQty('${i.id}', -1)" class="w-7 h-7 bg-gray-200 rounded-full">-</button>
                    <span>${i.qty}</span>
                    <button onclick="updateQty('${i.id}', 1)" class="w-7 h-7 bg-gray-200 rounded-full">+</button>
                    <button onclick="removeFromCart('${i.id}')" class="ml-auto text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    `).join("");
}

function updateQty(id, d) { let i = cart.find(i => i.id === id); if (i) { i.qty += d; if (i.qty <= 0) cart = cart.filter(i => i.id !== id); updateCartUI(); } }
function removeFromCart(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); }

// LIFF
async function initLIFF() {
    try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            user = { userId: profile.userId, name: profile.displayName, picture: profile.pictureUrl, email: "", phone: "", address: "" };
            document.getElementById("name").value = user.name;
            // โหลดโปรไฟล์และประวัติ
            await loadUserData();
        } else {
            liff.login();
        }
    } catch(e) { console.error(e); }
}

async function loadUserData() {
    showLoading();
    try {
        // โหลดโปรไฟล์
        const profileRes = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getUserProfileWrapper(user.userId);
        });
        const profileData = JSON.parse(profileRes);
        if (profileData) {
            user = { ...user, ...profileData };
            document.getElementById("name").value = user.displayName || user.name;
            document.getElementById("email").value = user.email || "";
            document.getElementById("phone").value = user.phone || "";
            document.getElementById("address").value = user.address || "";
        }
        
        // โหลดประวัติ
        const ordersRes = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getUserOrdersWrapper(user.userId);
        });
        orders = JSON.parse(ordersRes);
        console.log("ประวัติการสั่งซื้อ:", orders.length, "รายการ");
    } catch(e) { console.error("Load user data error:", e); }
    hideLoading();
}

async function saveProfile() {
    showLoading();
    user.displayName = document.getElementById("name").value;
    user.email = document.getElementById("email").value;
    user.phone = document.getElementById("phone").value;
    user.address = document.getElementById("address").value;
    
    try {
        await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveUserProfileWrapper(
                user.userId, user.name, user.displayName, user.email, user.phone, user.address, user.picture || ""
            );
        });
        Swal.fire({ title: "บันทึกสำเร็จ", icon: "success", timer: 1500, showConfirmButton: false });
    } catch(e) { Swal.fire({ title: "ผิดพลาด", text: e.message, icon: "error" }); }
    hideLoading();
}

async function submitOrder() {
    if (!cart.length) { Swal.fire("ผิดพลาด", "ไม่มีสินค้าในตะกร้า", "error"); return; }
    
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;
    if (!name || !email || !phone || !address) { Swal.fire("ผิดพลาด", "กรุณากรอกข้อมูลให้ครบ", "error"); return; }
    
    await saveProfile();
    
    const items = cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.qty }));
    const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    
    const formData = new FormData();
    formData.append("name", name);
    formData.append("email", email);
    formData.append("phone", phone);
    formData.append("address", address);
    formData.append("lineId", user.userId);
    formData.append("lineName", user.name);
    formData.append("items", JSON.stringify(items));
    formData.append("total", total);
    
    showLoading();
    try {
        const res = await fetch(API_URL, { method: "POST", body: formData });
        const result = await res.json();
        if (result.success) {
            Swal.fire({ title: "สั่งซื้อสำเร็จ!", text: "เลขที่: " + result.orderId, icon: "success" });
            cart = [];
            updateCartUI();
            document.getElementById("cartModal").classList.add("hidden");
            document.getElementById("checkoutModal").classList.add("hidden");
            // โหลดประวัติใหม่
            await loadUserData();
        } else { Swal.fire("ผิดพลาด", result.error, "error"); }
    } catch(e) { Swal.fire("ผิดพลาด", "เชื่อมต่อไม่ได้", "error"); }
    hideLoading();
}

// Event listeners
document.getElementById("cartIcon").onclick = () => { updateCartUI(); document.getElementById("cartModal").classList.remove("hidden"); };
document.getElementById("closeCart").onclick = () => document.getElementById("cartModal").classList.add("hidden");
document.getElementById("checkoutBtn").onclick = () => { if (cart.length) document.getElementById("checkoutModal").classList.remove("hidden"); else Swal.fire("ตะกร้าว่าง", "error"); };
document.getElementById("cancelCheckout").onclick = () => document.getElementById("checkoutModal").classList.add("hidden");
document.getElementById("confirmOrder").onclick = submitOrder;

// เริ่มต้น
loadProducts();
initLIFF();
</script>
</body>
</html>
